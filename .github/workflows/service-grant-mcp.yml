name: Gooo service-grant MCP transport

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/service-grant-mcp.yml'
      - 'examples/service-grant-mcp/**'
      - 'tools/service_grant_mcp_bundle.py'
      - 'tools/service_grant_mcp_bundle_test.py'
      - 'tools/api_policy_cli_bundle.py'
      - 'tools/service_policy_cli_bundle.py'
      - 'tools/service_grant_mcp_container*'
      - 'tools/verify-service-grant-container*'
      - 'containers/service-grant-mcp/**'
      - 'docs/service-grant-container.md'
  pull_request:
    paths:
      - '.github/workflows/service-grant-mcp.yml'
      - 'examples/service-grant-mcp/**'
      - 'tools/service_grant_mcp_bundle.py'
      - 'tools/service_grant_mcp_bundle_test.py'
      - 'tools/api_policy_cli_bundle.py'
      - 'tools/service_policy_cli_bundle.py'
      - 'tools/service_grant_mcp_container*'
      - 'tools/verify-service-grant-container*'
      - 'containers/service-grant-mcp/**'
      - 'docs/service-grant-container.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wire-client:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOTELEMETRY: 'off'
      CGO_ENABLED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-mod=readonly -p=1'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Preserve the first failure when a child exits early
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/service-grant-mcp
          python3 -I -B examples/service-grant-mcp/verify_close_test.py \
            --verifier "$PWD/examples/service-grant-mcp/verify.py" \
            --out "$PWD/out/service-grant-mcp/teardown"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the pinned transport and inspect its identity
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p out/service-grant-mcp
          go -C examples/service-grant-mcp vet ./...
          go -C examples/service-grant-mcp build -trimpath -o "$RUNNER_TEMP/gooo-service-grant-mcp" .
          go version -m -json "$RUNNER_TEMP/gooo-service-grant-mcp" > out/service-grant-mcp/build-info.json
      - name: Check concurrent handlers with the race detector
        shell: bash
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go -C examples/service-grant-mcp test -race -count=1 ./...
      - name: Verify with an independent stdio client
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B examples/service-grant-mcp/verify.py \
            --binary "$RUNNER_TEMP/gooo-service-grant-mcp" \
            --build-info "$PWD/out/service-grant-mcp/build-info.json" \
            --out "$PWD/out/service-grant-mcp/wire"
      - name: Verify the optional ordered-request tool independently
        shell: bash
        run: |
          set -euo pipefail
          many_module="$(go -C examples/service-grant-mcp list -m -f '{{if eq .Version "v0.0.0-20261020182808-7180a4a0f36a"}}{{.Dir}}{{end}}' github.com/kimjooyoon/gooo-go-ports/examples/service-grant-many)"
          test -n "$many_module"
          python3 -I -B examples/service-grant-mcp/verify_many.py \
            --binary "$RUNNER_TEMP/gooo-service-grant-mcp" \
            --legacy-verifier "$PWD/examples/service-grant-mcp/verify.py" \
            --many-module "$many_module" \
            --out "$PWD/out/service-grant-mcp/many-wire"
      - name: Verify the optional alias comparison through both protocol versions
        shell: bash
        run: |
          set -euo pipefail
          alias_version="v0.0.0-20261024154510-16d1e7864dc8"
          alias_module="$(go -C examples/service-grant-mcp list -m -f '{{if eq .Version "v0.0.0-20261024154510-16d1e7864dc8"}}{{.Dir}}{{end}}' github.com/kimjooyoon/gooo-go-ports/examples/alias-origin-change)"
          test -n "$alias_module"
          mkdir -p "$RUNNER_TEMP/alias-cli-bin"
          GOBIN="$RUNNER_TEMP/alias-cli-bin" go install -trimpath \
            "github.com/kimjooyoon/gooo-go-ports/examples/alias-origin-change/cmd/compare@$alias_version"
          python3 -I -B examples/service-grant-mcp/verify_alias.py \
            --binary "$RUNNER_TEMP/gooo-service-grant-mcp" \
            --alias-cli "$RUNNER_TEMP/alias-cli-bin/compare" \
            --alias-module "$alias_module" --go "$(command -v go)" \
            --legacy-verifier "$PWD/examples/service-grant-mcp/verify.py" \
            --scope full --out "$PWD/out/service-grant-mcp/alias-wire"
      - name: Check native MCP packaging refusal controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/service_grant_mcp_bundle_test.py
          python3 -I -B tools/service_grant_mcp_container_test.py
          python3 -I -B tools/verify-service-grant-container_test.py
      - name: Package and verify the extracted native MCP transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -B tools/service_grant_mcp_bundle.py \
            --binary "$RUNNER_TEMP/gooo-service-grant-mcp" \
            --build-info "$PWD/out/service-grant-mcp/build-info.json" \
            --wire-report "$PWD/out/service-grant-mcp/wire/verification.json" \
            --many-wire-report "$PWD/out/service-grant-mcp/many-wire/acceptance.json" \
            --alias-wire-report "$PWD/out/service-grant-mcp/alias-wire/acceptance.json" \
            --alias-cli "$RUNNER_TEMP/alias-cli-bin/compare" \
            --module-cache "$(go env GOMODCACHE)" \
            --go-root "$(go env GOROOT)" --root "$PWD" \
            --out "$PWD/out/service-grant-mcp-bundle" \
            --source-commit "$GITHUB_SHA" --packager-commit "$GITHUB_SHA" \
            --verify-native
      - name: Build and smoke-test the offline nonroot container
        if: runner.os == 'Linux'
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          container_out="$PWD/out/service-grant-mcp-container"
          mkdir -p "$container_out"
          archive_sha="$(jq -er '.archive.sha256' out/service-grant-mcp-bundle/verification.json)"
          python3 -I -B tools/service_grant_mcp_container.py \
            --bundle "$PWD/out/service-grant-mcp-bundle/gooo-service-grant-mcp-linux-amd64.tar.gz" \
            --sha256 "$archive_sha" --source-commit "$GITHUB_SHA" \
            --out "$container_out/context"
          docker build --network=none --pull=false --platform=linux/amd64 \
            --iidfile "$container_out/image.id" "$container_out/context" \
            > "$container_out/build.stdout" 2> "$container_out/build.stderr"
          python3 -I -B tools/verify-service-grant-container.py \
            --docker "$(command -v docker)" --image "$(cat "$container_out/image.id")" \
            --context "$container_out/context" --out "$container_out/wire" \
            --alias-wire-report "$PWD/out/service-grant-mcp/alias-wire/acceptance.json" \
            --alias-module "$(go -C examples/service-grant-mcp list -m -f '{{.Dir}}' github.com/kimjooyoon/gooo-go-ports/examples/alias-origin-change)" \
            --alias-cli "$RUNNER_TEMP/alias-cli-bin/compare" --go "$(command -v go)" \
            --label "io.gooo.ci.run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Remove only this job's container test resources
        if: always() && runner.os == 'Linux'
        timeout-minutes: 1
        shell: bash
        run: |
          set -euo pipefail
          ids="$(docker container ls --all --quiet --no-trunc \
            --filter "label=io.gooo.ci.run=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT")"
          if test -n "$ids"; then
            docker container rm --force $ids
          fi
          if test -f out/service-grant-mcp-container/image.id; then
            docker image rm "$(cat out/service-grant-mcp-container/image.id)"
          fi
      - name: Retain container identity, wire and closure diagnostics
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-grant-mcp-container-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            out/service-grant-mcp-container/context/context.json
            out/service-grant-mcp-container/image.id
            out/service-grant-mcp-container/build.stdout
            out/service-grant-mcp-container/build.stderr
            out/service-grant-mcp-container/wire/
      - name: Retain verified native MCP distribution candidates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-grant-mcp-native-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            out/service-grant-mcp-bundle/*.tar.gz
            out/service-grant-mcp-bundle/*.sha256
            out/service-grant-mcp-bundle/verification.json
      - name: Retain bounded native packaging diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-grant-mcp-packaging-evidence-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            out/service-grant-mcp-bundle/first-failure.json
            out/service-grant-mcp-bundle/native-verification/
            out/service-grant-mcp-bundle/many-native-verification/
            out/service-grant-mcp-bundle/alias-native-verification/
      - name: Retain the bounded original wire observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-grant-mcp-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: out/service-grant-mcp/
