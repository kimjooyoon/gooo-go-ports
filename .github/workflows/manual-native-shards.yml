name: Manual full82 native shard experiment

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed source commit (40 lowercase hex characters)
        required: true
        type: string

# A separate opt-in observation. Never replaces or filters required ci.yml.
permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  SOURCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOENV: 'off'
  CGO_ENABLED: '0'
  GOMAXPROCS: '2'

jobs:
  plan:
    name: Plan full native shards
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Check orchestration and consumer refusal controls
        run: |
          python3 -I -B tools/manual-native-shard_test.py -v
          python3 -I -B tools/native-shard-reference_test.py -v
          python3 -I -B tools/check-header-addition-host_test.py -v
      - name: Build one compiler and plan all original82 suites
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B tools/manual-native-shard.py plan --root "$PWD"
          --go "$(go env GOROOT)/bin/go" --out "$RUNNER_TEMP/manual-native-control"
      - name: Preserve original planner control and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manual-native-${{ github.run_id }}-a${{ github.run_attempt }}-control
          path: ${{ runner.temp }}/manual-native-control/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  native-shards:
    name: native-shard-${{ matrix.index }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        index: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Execute original full-plan shard and retain its raw evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B tools/manual-native-shard.py worker --root "$PWD"
          --go "$(go env GOROOT)/bin/go" --index '${{ matrix.index }}'
          --out "$RUNNER_TEMP/manual-native-worker-${{ matrix.index }}"
      - name: Preserve original shard evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manual-native-${{ github.run_id }}-a${{ github.run_attempt }}-shard-${{ matrix.index }}
          path: ${{ runner.temp }}/manual-native-worker-${{ matrix.index }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  join:
    name: Join full native shards
    if: always()
    needs: [plan, native-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false
      - name: Reconcile official jobs and inspect all original receipts and consumers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I -B tools/manual-native-shard.py join --root "$PWD"
          --go "$(go env GOROOT)/bin/go" --out "$RUNNER_TEMP/manual-native-joined"
      - name: Preserve joined evidence and first failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: manual-native-${{ github.run_id }}-a${{ github.run_attempt }}-joined
          path: ${{ runner.temp }}/manual-native-joined/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
