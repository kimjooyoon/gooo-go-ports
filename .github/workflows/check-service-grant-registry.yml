name: Check fixed Gooo MCP Registry metadata without authentication

on:
  pull_request:
    paths:
      - '.github/workflows/check-service-grant-registry.yml'
      - '.github/workflows/registry-install-smoke.yml'
      - '.github/workflows/publish-service-grant-registry.yml'
      - 'tools/publish-service-grant-registry.py'
      - 'tools/publish-service-grant-registry_test.py'
      - 'tools/verify-service-grant-container.py'
      - 'tools/verify-service-grant-container_test.py'
      - 'tools/service_grant_mcp_oci.py'
      - 'containers/service-grant-mcp/**'
      - 'registry/service-grant-preview13.server.json'
      - 'registry/service-grant-preview14.server.json'
      - 'registry/service-grant-preview15.server.json'
      - 'registry/service-grant-preview16.server.json'
      - 'registry/service-grant-preview17.server.json'
      - 'tools/profiles/mcp-registry-preview17.json'
      - 'tools/profiles/mcp-public-*.json'
      - 'tools/service_grant_release_profile*'
      - 'tools/service_grant_mcp_reference*'
      - 'tools/registry_publication_profile_test.py'
      - 'tools/check-ci-scope-workflow_test.py'
      - 'examples/service-grant-mcp/**'

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'kimjooyoon/gooo-go-ports' && github.event_name == 'pull_request'
    strategy:
      matrix:
        release_version: [v0.1.0-preview.16, v0.1.0-preview.17]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      REQUESTED_RELEASE_VERSION: ${{ matrix.release_version }}
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - name: Check out the current PR merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check no-auth mode and publication safety
        run: |
          python3 -I -B tools/publish-service-grant-registry_test.py -v
          python3 -I -B tools/registry_publication_profile_test.py -v
      - name: Validate pinned public metadata without authentication or publication
        run: >-
          python3 -I -B tools/publish-service-grant-registry.py
          --out "$RUNNER_TEMP/gooo-registry-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --validate-only --release-version "$REQUESTED_RELEASE_VERSION"
      - name: Retain anonymous checks and credential-free process summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-registry-check-${{ matrix.release_version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gooo-registry-check-${{ github.run_id }}-${{ github.run_attempt }}/proof
          if-no-files-found: error
          retention-days: 7

  install-candidate:
    needs: validate
    strategy:
      matrix:
        release_version: [v0.1.0-preview.16, v0.1.0-preview.17]
    permissions:
      contents: read
    uses: ./.github/workflows/registry-install-smoke.yml
    with:
      release_version: ${{ matrix.release_version }}
