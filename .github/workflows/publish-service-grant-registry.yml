name: Publish Gooo service-grant metadata to the MCP Registry

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: gooo-mcp-registry-preview15
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kimjooyoon/gooo-go-ports' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      GOPROXY: 'off'
      GOSUMDB: 'off'
    steps:
      - name: Check out reviewed publication source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check publication safety without authentication
        run: python3 -I -B tools/publish-service-grant-registry_test.py -v
      - name: Verify the public preview, then publish its fixed metadata once
        run: >-
          python3 -I -B tools/publish-service-grant-registry.py
          --out "$RUNNER_TEMP/gooo-registry-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          --allow-publish
      - name: Retain public checks and credential-free process summaries
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-registry-preview15-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gooo-registry-${{ github.run_id }}-${{ github.run_attempt }}/proof
          if-no-files-found: error
          retention-days: 7
