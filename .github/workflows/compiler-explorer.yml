name: Experimental Gooo Compiler Explorer verification

on:
  pull_request:
    paths:
      - '.github/workflows/compiler-explorer.yml'
      - 'tools/compiler-explorer/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/compiler-explorer.yml'
      - 'tools/compiler-explorer/**'

permissions:
  contents: read

jobs:
  compiler-explorer-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GOOO_LAYA_URL: ''
      GOOO_LAYA_API_KEY: ''
      CYPRESS_INSTALL_BINARY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.1'
      - name: Use the pinned Compiler Explorer package manager
        run: npm install --global npm@11.2.0 --no-audit --no-fund
      - name: Verify the release and generated Go adapter on Linux
        run: bash tools/compiler-explorer/verify-linux.sh
      - name: Preserve checks and actual compiler observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiler-explorer-linux-${{ github.sha }}
          path: out/compiler-explorer-linux/
          if-no-files-found: warn
          retention-days: 14
