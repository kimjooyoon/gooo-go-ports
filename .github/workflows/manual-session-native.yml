name: Manual full82 experimental native session

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact reviewed consumer/workflow commit (40 lowercase hex characters)
        required: true
        type: string

# Manual qualification only; never filters or replaces required ci.yml.
permissions:
  contents: read

env:
  EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
  SOURCE_WORKFLOW_SHA: ${{ github.workflow_sha }}
  ENGINE_REVISION: '276734167edc7f5fef18cbb79004ea9592553317'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOENV: 'off'

jobs:
  full-session-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.3'
          cache: false
      - name: Bind the exact manual source and isolated work
        id: prepare
        run: |
          set -euo pipefail
          umask 077
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$EXPECTED_SOURCE_SHA" = "$GITHUB_SHA"
          test "$SOURCE_WORKFLOW_SHA" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1)"
          test "$(go env GOVERSION)" = go1.27.3
          test "$(go env GOOS)/$(go env GOARCH)" = linux/amd64
          work=$(mktemp -d "$RUNNER_TEMP/full-session276.XXXXXX")
          mkdir "$work/diagnostics" "$work/upload" "$work/go-cache" "$work/module-cache" "$work/go-tmp"
          printf 'SESSION_WORK=%s\nGOCACHE=%s/go-cache\nGOMODCACHE=%s/module-cache\nGOTMPDIR=%s/go-tmp\n' "$work" "$work" "$work" "$work" >> "$GITHUB_ENV"
          printf 'SESSION_GO=%s\n' "$(go env GOROOT)/bin/go" >> "$GITHUB_ENV"
          git ls-files -z | xargs -0 sha256sum > "$work/diagnostics/source-before.sha256"
          git ls-files --stage > "$work/diagnostics/source-modes.txt"
          jq -n --arg head "$GITHUB_SHA" --arg tree "$(git rev-parse HEAD^{tree})" \
            --arg workflow "$SOURCE_WORKFLOW_SHA" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{head:$head,tree:$tree,workflow_sha:$workflow,run:$run,attempt:$attempt,event:"workflow_dispatch",
              scope:"Manual experimental276 full legacy verifier; default205/native17 and required CI unchanged."}' \
            > "$work/diagnostics/source.json"
      - name: Check bounded controller and cleanup fault controls
        timeout-minutes: 2
        run: |
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label controller-controls --timeout 90 -- \
            python3 -I -B tools/manual-session-native_test.py -v
      - name: Build and identify the existing pinned experimental compiler
        timeout-minutes: 10
        run: |
          set -euo pipefail
          engine="$SESSION_WORK/engine-source"
          git init "$engine"
          git -C "$engine" remote add origin https://github.com/kimjooyoon/meta-ontology-go.git
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label engine-fetch --timeout 90 -- \
            git -C "$engine" fetch --depth=1 --no-tags origin "$ENGINE_REVISION"
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label engine-checkout --timeout 20 -- git -C "$engine" checkout --detach "$ENGINE_REVISION"
          test "$(git -C "$engine" rev-parse HEAD)" = "$ENGINE_REVISION"
          test -z "$(git -C "$engine" status --porcelain=v1 --untracked-files=all --ignored)"
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label engine-build --timeout 480 -- \
            go -C "$engine" build -trimpath -mod=readonly -o "$SESSION_WORK/gooo" ./cmd/gooo
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label compiler-identity --timeout 15 -- "$SESSION_WORK/gooo" version --build --json
          jq -e --arg revision "$ENGINE_REVISION" '
            .compiler_source_sha==$revision and .go_version=="go1.27.3" and
            .native_go_required=="go1.27.3" and .source_status=="CLEAN_VCS" and .vcs_modified=="false"
          ' "$SESSION_WORK/diagnostics/logs/compiler-identity.stdout"
          test -z "$(git -C "$engine" status --porcelain=v1 --untracked-files=all --ignored)"
      - name: Build the source-bound consumer verifier
        timeout-minutes: 3
        run: |
          set -euo pipefail
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label verifier-build --timeout 150 -- \
            go build -mod=readonly -o "$SESSION_WORK/verify-session" ./cmd/verify
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label verifier-build-info --timeout 15 -- go version -m "$SESSION_WORK/verify-session"
          grep -F "vcs.revision=$EXPECTED_SOURCE_SHA" "$SESSION_WORK/diagnostics/logs/verifier-build-info.stdout"
          grep -F 'vcs.modified=false' "$SESSION_WORK/diagnostics/logs/verifier-build-info.stdout"
          python3 -I -B tools/manual-session-native.py capture --work "$SESSION_WORK" \
            --label go-version --timeout 10 -- go version
          sha256sum "$SESSION_WORK/verify-session" "$SESSION_WORK/gooo" "$(go env GOROOT)/bin/go" \
            > "$SESSION_WORK/diagnostics/binaries.sha256"
          sha256sum --check --status "$SESSION_WORK/diagnostics/source-before.sha256"
          test -z "$(git status --porcelain=v1)"
      - name: Run the original full legacy verifier once
        id: native
        timeout-minutes: 24
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
          GOFLAGS: '-mod=readonly'
        run: |
          python3 -I -B tools/manual-session-native.py native --work "$SESSION_WORK" \
            --compiler "$SESSION_WORK/gooo" --go "$SESSION_GO"
      - name: Check full population, original partition and owner cleanup
        env:
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          python3 -I -B - <<'PY'
          import hashlib, json, os, runpy
          from pathlib import Path
          work=Path(os.environ['SESSION_WORK']); root=work/'records'; diag=work/'diagnostics'
          bounded=runpy.run_path('tools/manual-session-native.py')['bounded_read']
          load=lambda p:json.loads(bounded(p))
          summary=load(root/'summary.json'); control=load(root/'session-observations.json')
          expected=load(Path('cmd/verify/testdata/native-verification-contract-v1.json').resolve())['suites']
          # Source-bound original legacy partition, not the compact CI batch vector.
          batches=[5,2,2,2,2,2,2,2,1,2,2,2,2,2,1,3,3,11,11,21,20,12,14,14,28,5,9,33,8,72,4,16,16,16,16,28,9,15,20,30,6,16,14,14,16,66,22,22,21,57,43,71,21,28,257,277,325,18,18,137,137,281,1,1,1,2,5,4,77,4,3,3,15,7,22,37,3,2,2,5,50,3]
          runs=summary['runs']; owners={(r['package'],r['activity']):r for r in control['owners']}
          assert summary['schema']=='gooo/go-ports-session-differential/v1' and summary['execution_profile']=='experimental-session-276-gzip-v1'
          assert summary['compiler_revision']==os.environ['ENGINE_REVISION'] and summary['oracle_lock_compiler_revision']=='205896a413e5dea92366309c35ae85e542d055f6'
          assert summary['go_version']=='go1.27.3' and summary['goos']=='linux' and summary['goarch']=='amd64' and summary['native_suite_workers']==4
          assert summary['cases']==summary['passed']==175649 and len(runs)==len(expected)==len(owners)==82 and sum(batches)==2579
          assert control['schema']=='gooo/native-session-cli-summary/v1' and control['execution_profile']==summary['execution_profile']
          assert control['compiler_revision']==summary['compiler_revision'] and control['oracle_lock_compiler_revision']==summary['oracle_lock_compiler_revision']
          assert summary['receipt_storage']['encoding']=='gzip' and control['full82_accepted'] is False
          assert control['attempted_suites']==control['verified_suites']==82 and control['failed_suites']==0
          assert control['per_request_wait_resources']=={'status':'NOT_OBSERVED','user_cpu_ns':None,'system_cpu_ns':None,'peak_rss_bytes':None}
          execute_replay=closes=frames=0
          for actual,wanted,count in zip(runs,expected,batches):
              key=(wanted['package'],wanted['activity']); row=owners[key]
              assert (actual['package'],actual['activity'],actual['cases'])==(*key,wanted['cases'])
              assert actual['passed']==actual['cases'] and actual['batches']==count and actual['replay_equal'] is True
              assert row['verified'] is True and row['state']=='SUITE_VERIFIED_OWNER_CLOSED'
              p=Path(row['lifecycle_path']); assert p.resolve()==p and root in p.parents and not p.is_symlink()
              raw=bounded(p); assert row['lifecycle_sha256']=='sha256:'+hashlib.sha256(raw).hexdigest()
              owner=json.loads(raw)
              assert all(owner[k] is True for k in ['closed','waited','streams_joined','close_request_sent','close_response_received'])
              assert owner['exit_code']==0 and owner['error'] is None and owner['process_group_remaining'] is False and owner['owned_entries_after_close']==[]
              assert owner['native_work']==str(p.parent/'session-transport/native-work')
              assert owner['evidence_root']==str(p.parent/'session-transport')
              assert not list(Path(owner['native_work']).iterdir())
              operations=[r['operation'] for r in owner['requests']]
              assert operations==['execute','replay']*count+['close'] and len(owner['frames'])==len(operations)
              execute_replay+=len(operations)-1; closes+=1; frames+=len(owner['frames'])
          assert execute_replay==5158 and closes==82 and frames==5240
          before=load(root/'session-source.json'); after=load(root/'session-source-final.json')
          assert after['unchanged'] is True and after['observed']==before['identity']
          assert len(before['identity']['source_files'])==316 and before['historical_293_roster_extended'] is False
          for role,p in [('compiler',work/'gooo'),('verifier',work/'verify-session'),('go',Path(os.environ['SESSION_GO']))]:
              with p.open('rb') as stream: digest=hashlib.file_digest(stream,'sha256').hexdigest()
              assert before['identity']['binaries'][role]=={'bytes':p.stat().st_size,'sha256':digest}
          reports=sorted(root.glob('*exhaustive*/exhaustive.json')); assert len(reports)==7
          (diag/'qualification.json').write_text(json.dumps({'status':'GO_VERIFIER_AND_BOUNDED_METADATA_PASS',
              'suites':82,'cases':175649,'legacy_batches':2579,'execute_replay_requests_observed':execute_replay,'close_requests_observed':closes,'frames_observed':frames,
              'current_native_run_reports_required_by_Go_inspector':10316,'exhaustive_checks':7,
              'per_request_Rusage':'NOT_OBSERVED','artifact_build_reuse_census':'NOT_COLLECTED',
              'scope':'One manual Linux observation; not independent raw-receipt audit or required-CI/default-pin promotion.'},indent=2)+'\n')
          PY
          sha256sum --check --status "$SESSION_WORK/diagnostics/source-before.sha256"
          test -z "$(git status --porcelain=v1)"
          test -z "$(git -C "$SESSION_WORK/engine-source" status --porcelain=v1 --untracked-files=all --ignored)"
      - name: Retain bounded source, process, summary and lifecycle metadata
        if: always() && steps.prepare.outcome == 'success'
        run: |
          python3 -I -B tools/manual-session-native.py collect --work "$SESSION_WORK"
      - name: Preserve the bounded manual diagnostic artifact
        if: always() && steps.prepare.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: manual-session276-full82-${{ github.run_id }}-a${{ github.run_attempt }}
          path: ${{ env.SESSION_WORK }}/upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
