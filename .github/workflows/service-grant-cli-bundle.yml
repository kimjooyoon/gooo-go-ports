name: Service-grant native CLI bundle

on:
  pull_request:
    paths:
      - '.github/workflows/service-grant-cli-bundle.yml'
      - 'tools/service_policy_cli_bundle.py'
      - 'tools/api_policy_cli_bundle.py'
      - 'tools/api_policy_cli_bundle_test.py'
      - 'tools/licenses/gooo-83928fa-MIT.txt'
      - 'examples/agentmesh-service-policy/**'
      - 'LICENSE'
      - 'docs/service-grant-cli.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GOTOOLCHAIN: local
      GOENV: 'off'
      GOWORK: 'off'
      CGO_ENABLED: '0'
      GOOS: linux
      GOARCH: amd64
      GOMAXPROCS: '2'
      GOFLAGS: '-p=1'
      GOTELEMETRY: 'off'
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
      GOPRIVATE: ''
      GONOPROXY: ''
      GONOSUMDB: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check packaging refusal controls
        run: python3 -I -B tools/api_policy_cli_bundle_test.py -v
      - name: Install the immutable public CLI once and test its extracted archive
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          bundle_work="$(mktemp -d "$RUNNER_TEMP/service-grant.XXXXXX")"
          cleanup_bundle_work() {
            local prior_status=$? cleanup_failure_status=1
            if [ "$prior_status" -ne 0 ]; then cleanup_failure_status=$prior_status; fi
            case "$bundle_work" in
              "$RUNNER_TEMP"/service-grant.??????) ;;
              *) printf '%s\n' 'Refusing cleanup outside the owned bundle path' >&2; return "$cleanup_failure_status" ;;
            esac
            if [ -L "$bundle_work" ] || [ ! -d "$bundle_work" ]; then
              printf '%s\n' 'Refusing cleanup of a non-directory or symlink' >&2
              return "$cleanup_failure_status"
            fi
            # Go's module cache contains read-only directories. Do not follow
            # symlinks or change anything outside this one mktemp directory.
            find -P "$bundle_work" -type d -exec chmod u+w {} + || return "$cleanup_failure_status"
            rm -rf -- "$bundle_work" || return "$cleanup_failure_status"
            test ! -e "$bundle_work" && test ! -L "$bundle_work" || return "$cleanup_failure_status"
            return "$prior_status"
          }
          trap cleanup_bundle_work EXIT
          export GOCACHE="$bundle_work/cache" GOMODCACHE="$bundle_work/modcache"
          export GOPATH="$bundle_work/gopath" GOBIN="$bundle_work/bin" TMPDIR="$bundle_work/tmp"
          mkdir -p "$GOBIN" "$TMPDIR"
          module=github.com/kimjooyoon/gooo-go-ports/examples/agentmesh-service-policy
          version=v0.0.0-20261018191951-2aa0f96805f1
          timeout 180s go install "$module/cmd/evaluate@$version"
          python3 -I -B tools/service_policy_cli_bundle.py \
            --binary "$GOBIN/evaluate" --go "$(go env GOROOT)/bin/go" --root "$PWD" \
            --module-dir "$GOMODCACHE/$module@$version" \
            --module-zip "$GOMODCACHE/cache/download/$module/@v/$version.zip" \
            --packaging-sha "$(git rev-parse HEAD)" --out out/service-grant-cli-bundle
      - name: Retain checked distribution and bounded check evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: service-grant-cli-linux-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            out/service-grant-cli-bundle/gooo-service-grant-evaluate-linux-amd64.tar.gz
            out/service-grant-cli-bundle/gooo-service-grant-evaluate-linux-amd64.tar.gz.sha256
            out/service-grant-cli-bundle/verification.json
            out/service-grant-cli-bundle/first-failure.json
            out/service-grant-cli-bundle/build-info.*
            out/service-grant-cli-bundle/control-1.*
            out/service-grant-cli-bundle/control-2.*
            out/service-grant-cli-bundle/control-3.*
            out/service-grant-cli-bundle/control-4.*
