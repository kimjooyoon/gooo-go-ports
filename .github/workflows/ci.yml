  policy-native-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the exact checked PR tree
        id: change-scope
        run: |
          python3 -B tools/classify-ci-scope.py \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --expected-head "$GITHUB_SHA" --summary out/ci-scope.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: steps.change-scope.outputs.docs_only != 'true'
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify the public API policy consumer
        if: steps.change-scope.outputs.docs_only != 'true'
        env:
          PUBLIC_API_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B tools/check-api-policy-public-consumer.py --go "$(go env GOROOT)/bin/go" --revision "$PUBLIC_API_REVISION" --out "$PWD/out/api-policy-public-consumer" --bundle-cli
          jq -e '.schema == "gooo/api-policy-public-consumer/v1" and .status == "PUBLIC_API_POLICY_CONSUMER_PASS" and .acceptance.facts == 9 and .acceptance.positive_cases == 2 and .acceptance.decision_fields == 15 and .acceptance.difference_flags == 15 and .acceptance.summary_fields == 2 and .acceptance.public_asset_count == 38 and .acceptance.public_assets_exact == true and .acceptance.public_generation_exact == true and .acceptance.original_assets_exact == true and .acceptance.original_generation_unchanged == true and .acceptance.substitution_refused == true and .acceptance.runtime_empty_path == true and .acceptance.consumer_no_replace_or_workspace == true and .acceptance.direct_install == true and .acceptance.direct_install_cases == 2 and .acceptance.direct_install_tampered_report_refused == true and .acceptance.direct_install_batch_rows == 3 and .acceptance.direct_install_batch_tampered_report_refused == true and .acceptance.substitution_stdout_bytes == 0 and .acceptance.original_version == "v0.0.0-20261014100709-8cddcc4e65af" and .acceptance.original_commit == "8cddcc4e65afb42431f8f42a86f29859ae2f4d69" and .cli_bundle.status == "VALIDATED_NATIVE_CLI_BUNDLE" and .cli_bundle.platform == "linux/amd64" and .cli_bundle.archive_readback_verified == true and (.cli_bundle.members | length) == 10 and (.cli_bundle.archive.bytes > 0 and .cli_bundle.archive.bytes <= 33554432)' out/api-policy-public-consumer/verification.json
      - name: Build and identify the pinned compiler from a clean checkout
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          mkdir -p out
          sh tools/bootstrap.sh
          ./.gooo version --build --json > out/compiler-build.json
          jq -e '
            .version == "0.6.37-dev" and
            .compiler_source_sha == "205896a413e5dea92366309c35ae85e542d055f6" and
            .source_status == "CLEAN_VCS" and .vcs_modified == "false" and
            .go_version == "go1.27.3" and .native_go_required == "go1.27.3"
