            (.source_bindings | keys) == ["examples/literal-text-report/main.gooo", "ports/strings/literal.gooo", "ports/strings/search.gooo"] and
            all(.source_bindings[]; .source_digest | sha) and
            all([.manifest_digest, .inputs_digest, .execution_sha256, .replay_sha256,
                 .prior_result_sha256, .generated_sha256, .driver_sha256][]; sha)
