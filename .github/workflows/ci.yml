        run: |
          python3 -B examples/api-policy-revision/verify.py --compiler "$PWD/.gooo" --go "$(go env GOROOT)/bin/go" --out "$PWD/out/api-policy-revision"
          jq -e '.schema == "gooo/api-policy-revision-verification/v1" and .status == "FINITE_TWO_PROFILE_NATIVE_AND_SAVED_REPLAY_PASS" and .classifier_cases == 23 and .decision_fields == 15 and .fresh_process_pairs == 2 and .altered_report_refused == true and .original_generation_preserved == true' out/api-policy-revision/verification.json
      - name: Verify the Agent Mesh service-pattern adaptation
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python3 -B examples/agentmesh-service-policy/verify.py --compiler "$PWD/.gooo" --go "$(go env GOROOT)/bin/go" --out "$PWD/out/agentmesh-service-policy"
          jq -e '
            .schema == "gooo/agentmesh-native-verification/v1"
