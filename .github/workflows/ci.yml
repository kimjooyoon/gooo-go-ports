            and ([.workspace_batches[].case_count] | add) == 79
            and .bound_assets == .asset_tamper_refusals
            and .strict_json.max_count == 1024
            and .strict_json.max_batch_bytes == 1048576
            and .strict_json.max_component_bytes == 128
            and .verifier_helper_contracts.native_array_cardinality == true
            and .verifier_helper_contracts.all_raw_impact_facts_and_strict_types == true
            and .verifier_helper_contracts.complete_typed_workspace_delivery_identity == true
            and .verifier_helper_contracts.optimized_python_refused == true
            and .refinement.cases == 101
            and .refinement.fields_compared == 8
            and .refinement.family_cells == 36
            and .refinement.fresh_oracle_witnesses == 63
            and .refinement.fresh_oracle_matcher_observations == 126
            and (.refinement.workspace_batches | length) == 7
            and ([.refinement.workspace_batches[].case_count] | add) == 101
            and .verifier_helper_contracts.all_raw_refinement_facts_and_strict_types == true
            and .verifier_helper_contracts.checked_witness_domain == true
            and .domain.cases == 662
            and .domain.ascii_predicate_observations == 512
            and .domain.native_matches_frozen_oracle == true
            and (.domain.workspace_batches | length) == 11
            and ([.domain.workspace_batches[].case_count] | add) == 662
            and .checked.additional_cases == 250
            and .checked.invalid_cases == 243
            and .checked.valid_cases == 7
            and .checked.preserved_valid_cases == 180
            and .checked.native_cases == 430
            and .checked.fields == {matcher:3,impact:5,refinement:10}
            and (.checked.workspace_batches | length) == 17
            and ([.checked.workspace_batches[].case_count] | add) == 250
            and .checked.direct_raw_text_without_go_grammar_prefilter == true
            and .checked.first_invalid_argument_verified == true
            and (.checked.raw_compatibility | length) == 3
            and ([.checked.raw_compatibility[].case_count] | add) == 45
            and .verifier_helper_contracts.checked_typed_records == true
            and .verifier_helper_contracts.checked_default_workspace_routing == true
            and .verifier_helper_contracts.raw_compatibility_explicit == true
            and .verifier_helper_contracts.direct_domain_execution == true
            and .conditional_apply.cases == 21
            and .conditional_apply.native_cases == 21
            and .conditional_apply.fields_compared == 7
            and .conditional_apply.states == {ELIGIBLE:6,REFUSED:6,INVALID_INPUT:9}
            and (.conditional_apply.workspace_batches | length) == 2
            and ([.conditional_apply.workspace_batches[].case_count] | add) == 21
            and .conditional_apply.host_demo_cases == 4
            and (.conditional_apply.host_behavior_tests | length) == 18
            and .conditional_apply.host_race_checked == true
            and .conditional_apply.generation_boundary_mutations == 10
            and .conditional_apply.all_raw_facts_and_strict_types == true
            and .conditional_apply.complete_typed_workspace_delivery_identity == true
            and .conditional_apply.source_and_producer_bound == true
            and .conditional_apply.exact_replay_receipt_identity == true
          ' out/agentmesh-service-policy/verification.json
      - name: Upload offline policy experiment evidence
        if: always() && steps.change-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: decision-policy-pilot-evidence
          path: examples/decision-policy-pilot/out/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload execution and diagnostic evidence
        if: always() && steps.change-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-go-ports-evidence
          # Keep receipts and diagnostics; Go build caches are regenerable.
          path: |
            out/
            !out/ci/simple-fold-exhaustive/cache/**
            !out/ci/ycbcr-exhaustive-RGBToYCbCr/cache/**
            !out/ci/ycbcr-exhaustive-YCbCrToRGB/cache/**
