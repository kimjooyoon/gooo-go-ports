          python3 -I -B examples/autobot-resolver/verify.py --root "$PWD" --compiler "$PWD/.gooo" --go "$(go env GOROOT)/bin/go" --input-command "$PWD/out/autobot-line-input" --out "$PWD/out/autobot-resolver"
          jq -e '
            .schema == "gooo/autobot-resolver-verification/v1" and
            .status == "ORIGINAL_PYTHON_GO_AND_GOOO_REPLAY_204_PASS" and
            .failure == null and .stage == "complete" and .rows == 204 and .batches == 26 and
            .Gooo_commands == 52 and .helper_commands == 26 and
            .input_echoes_each_phase == 1836 and .output_fields_each_phase == 1632 and
            .finite_total == 0 and .model_calls == 0 and
            .source_tool_unchanged == true and .processes_closed == true and .owned_work_removed == true and
            (.verified | length) == 52 and (.commands | length) == 81 and
            ([.verified[] | select(.operation == "execute") | .rows] | add) == 204 and
            ([.verified[] | select(.operation == "replay") | .rows] | add) == 204 and
            all(.commands[]; .exit_code == 0 and .failure == null and .observed_owned_processes_remaining == []) and
            .compiler_revision == "205896a413e5dea92366309c35ae85e542d055f6"
          ' out/autobot-resolver/summary.json
      - name: Verify original Gooo tool-catalog change
        if: steps.change-scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: |
          bash examples/tool-catalog-change/verify.sh "$PWD/.gooo" "$(go env GOROOT)/bin/go" "$RUNNER_TEMP/tool-catalog-change"
          python3 -I -B examples/tool-catalog-change/check_test.py --records "$RUNNER_TEMP/tool-catalog-change" -v
          jq --slurpfile pins upstream.json -e '.status == "FINITE_SOURCE_CATALOG_MATCHED" and .native_cases == 27 and .replay_cases == 27 and .typed_fields_per_layer == 378 and .selected == {before:3,after:16} and (.added | length) == 13 and .compiler_source_sha == $pins[0].compiler_revision' "$RUNNER_TEMP/tool-catalog-change/catalog-check.json"
          jq --slurpfile pins upstream.json -e '.status == "FINITE_SELECTION_CONTROLS_MATCHED" and .native_cases == 20 and .replay_cases == 20 and .typed_fields_per_layer == 280 and .compiler_source_sha == $pins[0].compiler_revision' "$RUNNER_TEMP/tool-catalog-change/controls-check.json"
      - name: Preserve tool-catalog change evidence
        if: always() && steps.change-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tool-catalog-change-evidence
          path: ${{ runner.temp }}/tool-catalog-change
          if-no-files-found: warn
          retention-days: 14
      - name: Verify the original scoped deny-rule diagnostic
        if: steps.change-scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: |
          bash examples/deny-rule-scope/verify.sh "$PWD/.gooo" "$(go env GOROOT)/bin/go" "$RUNNER_TEMP/deny-rule-scope"
          jq --slurpfile pins upstream.json -e '.status == "FINITE_ORIGINAL_GOOO_SCOPE_POLICY_NATIVE_AND_REPLAY_MATCHED_GO_REFERENCE" and .native_cases == 87 and .saved_replay_cases == 87 and .fields_per_result == 12 and (.receipt_mutation_refusals | length) == 9 and .compiler == $pins[0].compiler_revision and .go == $pins[0].go_version and .model_calls == 0' "$RUNNER_TEMP/deny-rule-scope/verification.json"
      - name: Preserve scoped deny-rule evidence
        if: always() && steps.change-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deny-rule-scope-evidence
          path: ${{ runner.temp }}/deny-rule-scope
          if-no-files-found: warn
          retention-days: 14
      - name: Upload offline policy experiment evidence
        if: always() && steps.change-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: decision-policy-pilot-evidence
          path: examples/decision-policy-pilot/out/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload policy execution and diagnostic evidence
        if: always() && steps.change-scope.outputs.docs_only != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-go-ports-policy-evidence
          path: |
            out/ci-scope.json
            out/compiler-build.json
            out/cel-api-policy/
            out/api-policy-revision/
            out/agentmesh-service-policy/
            out/grant-candidate-selection/
            out/alias-origin-change/
            out/service-grant-many/summary.json
            out/service-grant-many/source-before.json
            out/service-grant-many/source-after.json
            out/service-grant-many/consumer-metadata.json
            out/service-grant-many/friendly-case-mapping.json
            out/service-grant-many/*/stdout
            out/service-grant-many/*/stderr
            out/service-grant-many/*/process.json
            out/service-grant-many/*/started-process.json
            out/service-grant-many-cancellation/
            out/etag-project/
            out/etag-project-evidence/
            out/api-policy-public-consumer/
            out/api-policy-original-download.json
            out/url-components/
            out/retry-after-facts/
            out/path-facts/
            out/redelivery-policy/
            out/ipv4/
            out/versioned-grant-change/
            out/editable-api-policy/
            out/editable-api-policy-helpers/
            out/autobot-resolver/
          if-no-files-found: warn
          retention-days: 14
      - name: Report documentation-only policy scope
        if: steps.change-scope.outputs.docs_only == 'true'
        run: |
          printf '%s\n' \
            'Allowlisted static-document content-only PR: policy execution is omitted by the unchanged exact-tree classifier.' \
            'Common checks, pinned compiler identity and declarations remain required in their original jobs.' \
            'This policy-native-checks job produced no native policy execution/replay receipts; existing observations are not rebound.' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve documentation-only policy scope
        if: always() && steps.change-scope.outputs.docs_only == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-go-ports-policy-documentation-scope
          path: out/ci-scope.json
          if-no-files-found: error
          retention-days: 14

  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build the actual Gooo composition for the browser
        run: |
          node --test tools/*.test.cjs
          sh tools/bootstrap.sh
          go run ./cmd/build-demo --out out/browser
          node tools/browser-smoke.cjs out/browser/site | tee out/browser/smoke.json
          node tools/text-inspector-smoke.cjs out/browser/site | tee out/browser/text-inspector-smoke.json
          node tools/crop-browser-smoke.cjs out/browser/site | tee out/browser/crop-smoke.json
          node tools/drag-crop-browser-smoke.cjs out/browser/site | tee out/browser/drag-crop-smoke.json
          node tools/tutorial-browser-smoke.cjs out/browser/site | tee out/browser/tutorial-smoke.json
          node tools/literal-search-smoke.cjs out/browser/site | tee out/browser/literal-search-smoke.json
          node tools/uuid-parse-smoke.cjs out/browser/site | tee out/browser/uuid-parse-smoke.json
          node tools/service-policy-smoke.cjs out/browser/site | tee out/browser/service-policy-smoke.json
          node tools/api-policy-browser-smoke.mjs --site "$PWD/out/browser/site" --module "$PWD/examples/api-policy-revision" --out "$PWD/out/browser/api-policy-smoke.json"
          jq -e '
            .schema == "gooo/api-policy-browser-smoke/v1"
            and .status == "FINITE_ACTUAL_API_POLICY_BROWSER_PACKAGE_PASS"
            and .direct_actual_Wasm_steps == 430
            and .saved_tamper_no_data_refusals == 287
            and .explicit_no_data_refusals == 377
            and .caller_own_override_controls == 15
            and .genuine_write_byte_authority_controls == 3
            and .public_manifest_bound == true
            and .fresh_native_fixture_receipt_verified == true
            and .shipped_worker_loader_checks.compare == true
            and .shipped_worker_loader_checks.replay == true
            and .shipped_worker_loader_checks.worker_hash_mismatch == true
            and .shipped_worker_loader_checks.runtime_hash_mismatch == true
            and .shipped_worker_loader_checks.wasm_hash_mismatch == true
            and .shipped_worker_loader_checks.native_binding_mismatch == true
          ' out/browser/api-policy-smoke.json
          sha256sum out/browser/site/api-policy.html out/browser/site/api-policy.js out/browser/site/api-policy-worker.js out/browser/site/api-policy/program.wasm out/browser/site/api-policy/wasm_exec.js out/browser/site/api-policy/manifest.json out/browser/site/api-policy/native-fixtures-receipt.json
          node tools/source-view-smoke.cjs out/browser/site | tee out/browser/source-view-smoke.json
          node tools/browser-codegen-smoke.cjs out/browser/site/codegen out/browser/codegen-evidence | tee out/browser/codegen-smoke.json
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Verify the edited tutorial and saved replay summary
        run: |
          python3 tools/verify-tutorial-change.py --out out/tutorial-change \
            --before out/browser/site/tutorial/execution.json
          jq -e '
            .schema == "gooo/tutorial-change-run/v1" and
            .status == "TUTORIAL_CHANGE_AND_REPLAY_CHECKED" and
            .compiler_pin == "205896a413e5dea92366309c35ae85e542d055f6" and
            .new_Gooo_commands == 2 and .model_calls == 0 and
            .reused_before != null and (.commands | length) == 6 and
            .repository_sources_unchanged == true and .compiler_binary_unchanged == true and
            .go_binary_unchanged == true and .all_owned_process_groups_closed == true and
            .all_owned_processes_waited == true and .owned_work_removed == true and
            .finalization_errors == [] and
            all(.commands[]; .exit == 0 and .process_group_closed == true and
              .output_complete == true and .stderr.bytes == 0)
          ' out/tutorial-change/run.json
          jq -e '
            .schema == "gooo/tutorial-change-summary/v1" and
            .status == "CHECKED_FINITE_OBSERVATIONS" and
            .receipt_compiler.source_revision == "205896a413e5dea92366309c35ae85e542d055f6" and
            .repository_revision == null and .repository_revision_status == "NOT_CAPTURED" and
            .replay_raw_parent_sha256 == .raw_records.after.sha256 and
            (.sources | length) == 2 and .sources[0].changed == false and .sources[1].changed == true and
            (.cases | length) == 4 and all(.cases[]; (.fields | length) == 4) and
            ([.cases[].fields[] | select(.changed)] | length) == 1 and
            .cases[2].fields[3].name == "label" and
            .cases[2].fields[3].before == "sensor: high" and
            .cases[2].fields[3].after == "sensor: low" and
            .cases[2].fields[3].replay == "sensor: low"
          ' out/tutorial-change/summary.json
      - name: Preserve tutorial edit comparison evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-tutorial-change-evidence
          path: out/tutorial-change/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify finite SemVer upgrade, minimum and comparison policies
        timeout-minutes: 6
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          set -euo pipefail
          export GOTOOLCHAIN=local GOWORK=off GOENV=off GOFLAGS= GOVCS='*:off'
          NATIVE_GO="$(go env GOROOT)/bin/go"
          SEMVER_MODULE_CACHE="$(mktemp -d "$RUNNER_TEMP/gooo-semver-module-cache-XXXXXX")"
          mkdir -p out/semver-example
          ./.gooo check ports/xmod/semver.gooo
          ./.gooo check examples/version-eligibility/main.gooo
          timeout -k 10s 20s python3 -I -B examples/version-eligibility/verify_test.py -v
          timeout -k 10s 20s python3 -I -B examples/version-eligibility/request-inputs_test.py -v
          timeout -k 10s 60s env GOMODCACHE="$SEMVER_MODULE_CACHE" \
            GOPRIVATE= GONOPROXY= GONOSUMDB= GOPROXY=https://proxy.golang.org GOSUMDB=sum.golang.org \
            "$NATIVE_GO" -C examples/version-eligibility/oracle mod download -json golang.org/x/mod@v0.29.0 \
            > out/semver-example/module-download.json
          jq -e '
            .Path == "golang.org/x/mod" and .Version == "v0.29.0" and
            .Sum == "h1:HV8lRxZC4l2cr3Zq1LvtOsi/ThTgWnUk/y64QSs8GwA=" and
            .GoModSum == "h1:NyhrlYXJ2H4eJiRy/WDBO6HMqZQ6q9nk4JzS3NuCK+w=" and
            (.Error // "") == ""
          ' out/semver-example/module-download.json
          export GOMODCACHE="$SEMVER_MODULE_CACHE" GOPROXY=off GOSUMDB=off GOPRIVATE= GONOPROXY= GONOSUMDB=
          timeout -k 10s 30s "$NATIVE_GO" -C examples/version-eligibility/oracle vet -mod=readonly ./...
          for policy in upgrade minimum compare-boundary stable major prerelease; do
            timeout -k 15s 120s python3 -I -B examples/version-eligibility/verify.py \
              --policy "$policy" --compiler "$PWD/.gooo" --go "$NATIVE_GO" \
              --module-cache "$SEMVER_MODULE_CACHE" --out "out/semver-example/$policy"
            jq -e --arg policy "$policy" '
              .schema == "gooo/version-eligibility-check/v1" and
              .policy == $policy and
              (if $policy == "compare-boundary" then
                .status == "FINITE_9_BOUNDARY_CASES_AND_FRESH_REPLAY_CHECKED" and .checked == 9
              elif $policy == "stable" then
                .status == "FINITE_12_CASES_AND_FRESH_REPLAY_CHECKED" and .checked == 12
              elif $policy == "minimum" or $policy == "major" or $policy == "prerelease" then
                .status == "FINITE_9_CASES_AND_FRESH_REPLAY_CHECKED" and .checked == 9
              else
                .status == "FINITE_8_CASES_AND_FRESH_REPLAY_CHECKED" and .checked == 8
              end) and
              .compiler_build.compiler_source_sha == "205896a413e5dea92366309c35ae85e542d055f6" and
              .compiler_build.vcs_modified == "false" and .compiler_build.go_version == "go1.27.3" and
              .sources_unchanged == true and .tools_unchanged == true and
              .all_processes_waited == true and .owned_work_removed == true and
              [.commands[].label] == ["go-version", "compiler-build", "oracle-build", "oracle-buildinfo", "oracle", "execute", "replay"] and
              all(.commands[]; .exit == 0 and .waited == true)
            ' "out/semver-example/$policy/summary.json"
          done
      - name: Preserve finite SemVer example evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-semver-example-evidence
          path: out/semver-example/
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve the tested site and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-demo
          path: out/browser/
          retention-days: 14
      - name: Package the verified main-branch site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/browser/site

  deploy-browser-demo:
    if: ${{ always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.observer-checks.result == 'success' && needs.native-execution.result == 'success' && needs.policy-native-checks.result == 'success' && needs.browser-demo.result == 'success' }}
    needs: [observer-checks, native-execution, policy-native-checks, browser-demo]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested browser demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
