      - name: Verify the isolated native URL component facts sidecar
        if: steps.change-scope.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: |
          set -euo pipefail
          python3 -I -B tools/check-url-components.py --root "$PWD" --compiler "$PWD/.gooo" --go "$(go env GOROOT)/bin/go" --out "$PWD/out/url-components"
          jq -e '
            .schema == "gooo/url-component-verification/v1" and
            .status == "NATIVE_ORACLE_AND_SAVED_REPLAY_MATCH" and
            .input_rows == 128 and .unique_inputs == 128 and
