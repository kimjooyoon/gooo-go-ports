      - name: Report documentation-only native scope
        if: steps.change-scope.outputs.docs_only == 'true'
        run: |
          printf '%s\n' \
            'Root README/CONTRIBUTING content-only PR: common checks, compiler identity and declarations ran.' \
            'This native-ports job did not run differential, exhaustive, probe, native-example or policy commands.' \
            'No new native-port execution/replay receipts were produced; existing observations are not rebound to this commit.' \
            'The browser-demo job retains its separate full build, checks and receipts.' | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Preserve documentation scope and compiler identity
        if: always() && steps.change-scope.outputs.docs_only == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-go-ports-documentation-scope
          path: |
            out/ci-scope.json
            out/compiler-build.json
          if-no-files-found: error
          retention-days: 14

  browser-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build the actual Gooo composition for the browser
        run: |
          node --test tools/*.test.cjs
          sh tools/bootstrap.sh
          go run ./cmd/build-demo --out out/browser
          node tools/browser-smoke.cjs out/browser/site | tee out/browser/smoke.json
          node tools/text-inspector-smoke.cjs out/browser/site | tee out/browser/text-inspector-smoke.json
          node tools/crop-browser-smoke.cjs out/browser/site | tee out/browser/crop-smoke.json
          node tools/drag-crop-browser-smoke.cjs out/browser/site | tee out/browser/drag-crop-smoke.json
          node tools/tutorial-browser-smoke.cjs out/browser/site | tee out/browser/tutorial-smoke.json
          node tools/literal-search-smoke.cjs out/browser/site | tee out/browser/literal-search-smoke.json
          node tools/uuid-parse-smoke.cjs out/browser/site | tee out/browser/uuid-parse-smoke.json
          node tools/service-policy-smoke.cjs out/browser/site | tee out/browser/service-policy-smoke.json
          node tools/api-policy-browser-smoke.mjs --site "$PWD/out/browser/site" --module "$PWD/examples/api-policy-revision" --out "$PWD/out/browser/api-policy-smoke.json"
          jq -e '
            .schema == "gooo/api-policy-browser-smoke/v1"
            and .status == "FINITE_ACTUAL_API_POLICY_BROWSER_PACKAGE_PASS"
            and .direct_actual_Wasm_steps == 422
            and .saved_tamper_no_data_refusals == 279
            and .explicit_no_data_refusals == 369
            and .caller_own_override_controls == 15
            and .genuine_write_byte_authority_controls == 3
            and .public_manifest_bound == true
            and .fresh_native_fixture_receipt_verified == true
            and .shipped_worker_loader_checks.compare == true
            and .shipped_worker_loader_checks.replay == true
            and .shipped_worker_loader_checks.worker_hash_mismatch == true
            and .shipped_worker_loader_checks.runtime_hash_mismatch == true
            and .shipped_worker_loader_checks.wasm_hash_mismatch == true
            and .shipped_worker_loader_checks.native_binding_mismatch == true
          ' out/browser/api-policy-smoke.json
          sha256sum out/browser/site/api-policy.html out/browser/site/api-policy.js out/browser/site/api-policy-worker.js out/browser/site/api-policy/program.wasm out/browser/site/api-policy/wasm_exec.js out/browser/site/api-policy/manifest.json out/browser/site/api-policy/native-fixtures-receipt.json
          node tools/source-view-smoke.cjs out/browser/site | tee out/browser/source-view-smoke.json
          node tools/browser-codegen-smoke.cjs out/browser/site/codegen out/browser/codegen-evidence | tee out/browser/codegen-smoke.json
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Preserve the tested site and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-demo
          path: out/browser/
          retention-days: 14
      - name: Package the verified main-branch site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/browser/site

  deploy-browser-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [native-ports, browser-demo]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested browser demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
