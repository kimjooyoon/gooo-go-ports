          ./.gooo check ports/strings/cut.gooo
          ./.gooo check examples/literal-cut-report/main.gooo
          ./.gooo check ports/strings/last_index.gooo
          ./.gooo check examples/literal-final-marker-report/main.gooo
          ./.gooo check ports/strconv/decimal.gooo
          ./.gooo check examples/payload-admission/main.gooo
          ./.gooo check ports/path/path.gooo
          ./.gooo check examples/path-facts/main.gooo
          ./.gooo check ports/path/clean.gooo
          ./.gooo check examples/path-alias-facts/main.gooo
          ./.gooo check ports/net/httpguts/headers.gooo
          ./.gooo check examples/header-field-facts/main.gooo
          ./.gooo check examples/diagnostic-header-addition/main.gooo
          ./.gooo check ports/net/textproto/canonical.gooo
          ./.gooo check examples/canonical-header-key/main.gooo
          ./.gooo check ports/net/url/escape.gooo
          ./.gooo check examples/url-context-facts/main.gooo
          ./.gooo check ports/net/http/etag.gooo
          ./.gooo check examples/strong-validator-facts/main.gooo
          ./.gooo check ports/net/http/precondition.gooo
          ./.gooo check examples/versioned-grant-change/main.gooo
          ./.gooo check examples/editable-api-policy/before.gooo
          ./.gooo check examples/editable-api-policy/after.gooo
          ./.gooo check ports/net/netip/ipv4.gooo
          ./.gooo check examples/ipv4-address-facts/main.gooo
          ./.gooo check ports/net/netip/prefix.gooo
          ./.gooo check examples/ipv4-prefix-probe/main.gooo
          ./.gooo check examples/ipv4-rule-pair/main.gooo
          ./.gooo check examples/automatic-redelivery/main.gooo
          ./.gooo check examples/deny-rule-scope/main.gooo
          ./.gooo check ports/cel/scalar_access.gooo
          ./.gooo check examples/cel-api-policy/main.gooo
          ./.gooo check ports/agentmesh/service_pattern.gooo
          ./.gooo check examples/agentmesh-service-policy/impact.gooo
          ./.gooo check examples/agentmesh-service-policy/refinement.gooo
          ./.gooo check examples/agentmesh-service-policy/domain.gooo
          ./.gooo check examples/agentmesh-service-policy/checked_matcher.gooo
          ./.gooo check examples/agentmesh-service-policy/checked_impact.gooo
          ./.gooo check examples/agentmesh-service-policy/checked_refinement.gooo
          ./.gooo check examples/agentmesh-service-policy/conditional_apply.gooo
      - name: Verify strict header input reaches the actual native CLI
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          mkdir -p out
          go build -mod=readonly -o out/header-facts-input ./cmd/header-facts-input
          python3 -I -B tools/check-header-facts-inputs.py --root "$PWD" --compiler "$PWD/.gooo" --input-command "$PWD/out/header-facts-input" --go "$(go env GOROOT)/bin/go" --out "$PWD/out/header-facts-input-route"
          jq -e '.schema == "gooo/header-facts-input-route/v1" and .status == "THREE_INPUT_ROUTES_AND16_PRELAUNCH_REFUSALS_PASS" and .failure == null and .positive_requests == 3 and .prelaunch_refusals == 16 and .actual_Gooo_commands == 6 and .typed_fields_checked == 72 and (.observations | length) == 6' out/header-facts-input-route/summary.json
      - name: Retain unsupported-body probes
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          sh tools/probe.sh --out out/probes
      - name: Compare the ports with Go and replay every batch
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python3 -I -B tools/native_verification_contract.py --root "$PWD" > out/native-contract-expected.json
          go mod download golang.org/x/net golang.org/x/text
          go mod verify
          go run -mod=readonly ./cmd/verify --workers 3 --case-profile uuid-and-literal-report-compact-v1 --workspace-profile dependency-closure-v1 --suite-order largest-corpus-first --fail-fast --timeout 60m --out out/ci --timing-out out/ci/timing.jsonl
          jq -e --slurpfile expected out/native-contract-expected.json '
            $expected[0] as $e |
            .schema == "gooo/go-ports-differential/v1" and
            .native_suite_workers == 3 and
            .native_fail_fast == true and
            .native_timeout_ns == 3600000000000 and
            .native_failure_selection == "first-completed-uncanceled" and
            .suite_order == "largest-corpus-first" and
            .planned_dispatch_indices == (.runs | to_entries | sort_by([-.value.cases, .key]) | map(.key)) and
            .go_version == "go1.27.3" and
            .compiler_revision == "205896a413e5dea92366309c35ae85e542d055f6" and
            .case_profile == {
              schema: "gooo/native-case-profile/v1", name: "uuid-and-literal-report-compact-v1",
              compiler_revision: "205896a413e5dea92366309c35ae85e542d055f6", go_version: "go1.27.3",
              entries: ["go/github.com/google/uuid:Validate", "app/uuid-format-inspector:Inspect", "go/github.com/google/uuid/text:ParseCanonical", "app/literal-text-report:Report"],
              basis_profile: "uuid-compact-v1",
              serializer: "Go1.27.3 json.Marshal(caseDocument(batch)) plus exactly one LF",
              maximum_rows: 128, raw_bytes_including_LF: 30000,
              translated_compact_engine_bytes: 32768, maximum_selected_source_bytes: 10485760,
              lowering_guard: "Pinned839 source-derived nonexpansion upper bound; not measured translated bytes or an actual LoweredName.",
              scope: "UUID3 retain the exact uuid-compact-v1 policy/wire bytes. Only literal-text Report adds compact wire bytes and new source-bounded partitions. Index/Count and decimal/payload policies remain unchanged. Original ordered cases, independent expectations, exact sources and fresh native execution/saved replay are required; no prior profile PASS, native capacity or speedup is inherited."
            } and
            .workspace_profile == {
              schema: "gooo/native-workspace-profile/v1", name: "dependency-closure-v1",
              basis: "legacy-selected-workspace",
              selection: "entry import closure over whole already-selected packages; original package/source order",
              compiler_revision: "205896a413e5dea92366309c35ae85e542d055f6", go_version: "go1.27.3"
            } and
            .ported_functions == 54 and .consumer_programs == 26 and .consumer_activities == 28 and
            .uuid_port_reference_cases == 21745 and .uuid_consumer_reference_cases == 21745 and
            .uuid_parse_reference_cases == 21867 and .uuid_parse_legacy_reference_inputs == 21745 and
            .uuid_parse_anchor_inputs == 136 and .uuid_parse_added_reference_inputs == 122 and
            .uuid_module_revision == "0f11ee6918f41a04c201eceeadf612a377bc7fbc" and
            .uuid_module_h1 == "h1:NIvaJDMOsjHA8n1jAhLSgzrAzy1Hgr+hNrb57e+94F0=" and
            .legacy_cases == 3147 and .unicode_reference_cases == 334 and .unicode_rejection_cases == 12 and
            .color_port_reference_cases == 1300 and .color_port_rejection_cases == 56 and
            .color_consumer_reference_cases == 637 and .color_consumer_rejection_cases == 24 and
            .rotation_port_reference_cases == 2472 and .rotation_port_rejection_cases == 36 and
            .rotation_consumer_reference_cases == 672 and .rotation_consumer_rejection_cases == 36 and
            .duration_port_reference_cases == 3578 and .duration_consumer_reference_cases == 1789 and
            .whitespace_port_reference_cases == 506 and .whitespace_port_rejection_cases == 8 and
            .whitespace_consumer_reference_cases == 506 and .whitespace_consumer_rejection_cases == 8 and
            .classification_port_reference_cases == 5043 and .classification_port_rejection_cases == 24 and
            .classification_consumer_reference_cases == 4570 and .classification_consumer_rejection_cases == 12 and
            .geometry_port_reference_cases == 1711 and .geometry_consumer_reference_cases == 486 and
            .rectangle_in_reference_cases == 570 and .fits_crop_reference_cases == 570 and
            .containment_baseline_reference_inputs == 486 and .containment_added_reference_inputs == 84 and
            .rectangle_in_reference_cases == (.containment_baseline_reference_inputs + .containment_added_reference_inputs) and
