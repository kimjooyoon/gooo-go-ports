name: Go to Gooo differential verification

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  native-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the exact checked PR tree
        id: change-scope
        run: |
          python3 -B tools/classify-ci-scope.py \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --expected-head "$GITHUB_SHA" --summary out/ci-scope.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Verify the public API policy consumer
        if: steps.change-scope.outputs.docs_only != 'true'
        env:
          PUBLIC_API_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 -B tools/check-api-policy-public-consumer.py --go "$(go env GOROOT)/bin/go" --revision "$PUBLIC_API_REVISION" --out "$PWD/out/api-policy-public-consumer"
          jq -e '.schema == "gooo/api-policy-public-consumer/v1" and .status == "PUBLIC_API_POLICY_CONSUMER_PASS" and .acceptance.facts == 9 and .acceptance.positive_cases == 2 and .acceptance.decision_fields == 15 and .acceptance.difference_flags == 15 and .acceptance.summary_fields == 2 and .acceptance.public_asset_count == 36 and .acceptance.public_assets_exact == true and .acceptance.public_generation_exact == true and .acceptance.original_assets_exact == true and .acceptance.original_generation_unchanged == true and .acceptance.substitution_refused == true and .acceptance.runtime_empty_path == true and .acceptance.consumer_no_replace_or_workspace == true and .acceptance.substitution_stdout_bytes == 0 and .acceptance.original_version == "v0.0.0-20261014100709-8cddcc4e65af" and .acceptance.original_commit == "8cddcc4e65afb42431f8f42a86f29859ae2f4d69"' out/api-policy-public-consumer/verification.json
      - name: Check the Go observer
        run: |
          # Upstream UUID archive files stay byte-exact; its added hash wrapper
          # is ours and remains subject to the normal formatter check.
          test -z "$(git ls-files -z '*.go' ':(exclude)third_party/google-uuid/**' | xargs -0 -r gofmt -l)"
          test -z "$(gofmt -l third_party/google-uuid/source_digest.go)"
          go vet ./...
          go test -race ./...
          python3 tools/bootstrap.test.py
          python3 tools/receipt_json_test.py
          python3 tools/check-drag-crop-example_test.py
          python3 tools/check-fixed-pixel-bounds_test.py
          python3 -B tools/check-alpha-matte_test.py -v
          python3 -B tools/check-fits-crop_test.py -v
          python3 -B tools/check-fits-crop-inputs_test.py -v
          python3 -B tools/check-literal-text-inputs_test.py -v
          python3 -B tools/classify-ci-scope_test.py -v
          python3 -B tools/check-ci-scope-workflow_test.py -v
          python3 -B tools/check-api-policy-public-consumer_test.py -v
          # Full scope runs these13 Python controls inside the bounded sidecar once.
          # Documentation-only PRs still run them as common non-native checks.
          if [ "${{ steps.change-scope.outputs.docs_only }}" = "true" ]; then
            python3 -I -B tools/check-path-facts_test.py
          fi
      - name: Check pinned Unicode table generation
        run: |
          go run ./cmd/gen-unicode --check
          go run ./cmd/gen-simple-fold --check
          go run ./cmd/gen-case-mapping --check
          python3 tools/gen-uuid-quote.py --check
      - name: Build and identify the pinned compiler from a clean checkout
        run: |
          mkdir -p out
          sh tools/bootstrap.sh
          ./.gooo version --build --json > out/compiler-build.json
          jq -e '
            .version == "0.6.32-dev" and
            .compiler_source_sha == "83928fa4538245abe33b08549da47f8cbdc50ed2" and
            .source_status == "CLEAN_VCS" and .vcs_modified == "false" and
            .go_version == "go1.27.2" and .native_go_required == "go1.27.2"
          ' out/compiler-build.json
      - name: Check Gooo declarations
        run: |
          ./.gooo check ports/net/http.gooo
          ./.gooo check ports/unicode/utf8.gooo
          ./.gooo check ports/unicode/utf16.gooo
          ./.gooo check ports/unicode/space.gooo
          ./.gooo check ports/math/bits.gooo
          ./.gooo check ports/image/color.gooo
          ./.gooo check ports/image/nrgba.gooo
          ./.gooo check examples/alpha-matte/main.gooo
          ./.gooo check ports/image/geometry.gooo
          ./.gooo check ports/image/canon.gooo
          ./.gooo check ports/image/fixed.gooo
          ./.gooo check ports/unicode/case_mapping.gooo
          ./.gooo check examples/case-inspector/main.gooo
          ./.gooo check examples/fixed-pixel-bounds/main.gooo
          ./.gooo check examples/crop-planner/drag_crop.gooo
          ./.gooo check examples/fits-crop/main.gooo
          ./.gooo check ports/google/uuid/quote.gooo
          ./.gooo check ports/google/uuid/validate.gooo
          ./.gooo check ports/google/uuid/text/parse_canonical.gooo
          ./.gooo check examples/uuid-format-inspector/main.gooo
          ./.gooo check ports/time/duration.gooo
          ./.gooo check ports/strings/search.gooo
          ./.gooo check ports/strings/literal.gooo
          ./.gooo check examples/literal-text-report/main.gooo
          ./.gooo check ports/strings/cut.gooo
          ./.gooo check examples/literal-cut-report/main.gooo
          ./.gooo check ports/path/path.gooo
          ./.gooo check examples/path-facts/main.gooo
          ./.gooo check ports/cel/scalar_access.gooo
          ./.gooo check examples/cel-api-policy/main.gooo
          ./.gooo check ports/agentmesh/service_pattern.gooo
          ./.gooo check examples/agentmesh-service-policy/impact.gooo
          ./.gooo check examples/agentmesh-service-policy/refinement.gooo
          ./.gooo check examples/agentmesh-service-policy/domain.gooo
          ./.gooo check examples/agentmesh-service-policy/checked_matcher.gooo
          ./.gooo check examples/agentmesh-service-policy/checked_impact.gooo
          ./.gooo check examples/agentmesh-service-policy/checked_refinement.gooo
          ./.gooo check examples/agentmesh-service-policy/conditional_apply.gooo
      - name: Verify the isolated native path facts sidecar
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python3 -B tools/check-path-facts.py --repository . --out out/path-facts --go "$(go env GOROOT)/bin/go" --compiler ./.gooo --timeout 300
          jq -e --arg out "$PWD/out/path-facts" \
            --slurpfile cleanup out/path-facts/work-cleanup.json \
            --slurpfile ext_cleanup out/path-facts/ext-native-work-cleanup.json \
            --slurpfile isabs_cleanup out/path-facts/isabs-native-work-cleanup.json \
            --slurpfile report_cleanup out/path-facts/report-native-work-cleanup.json '
            def digest: type == "string" and test("^(sha256:)?[0-9a-f]{64}$");
            def file: type == "object" and (.path | type) == "string" and
              (.bytes | type) == "number" and .bytes >= 0 and (.sha256 | digest);
            . as $s | [$ext_cleanup[0], $isabs_cleanup[0], $report_cleanup[0]] as $native |
            .schema == "gooo/path-facts-two-layer-CI/v1" and
            .status == "MANUAL24_CLI_REPLAY_AND_FULL9841_GENERATED_NATIVE_PASS" and
            .compiler_revision == "83928fa4538245abe33b08549da47f8cbdc50ed2" and .go_version == "go1.27.2" and
            .manual_input_count_per_entry == 24 and .manual_entry_count == 3 and
            .manual_execute_outputs == 72 and .manual_saved_replay_outputs == 72 and
            .generated_native_input_count_per_entry == 9841 and .generated_native_entry_outputs == 29523 and
            .generated_native_scalar_comparisons == 78728 and .full_CLI_outputs == 0 and .full_saved_replay_outputs == 0 and
            .strict_transport_refusals == 15 and .receipt_tamper_refusals == 18 and .native_receipt_expectation_cases == 0 and
            (.source_freeze | file) and (.original_Go_manual_oracle | file) and (.work_cleanup | file) and
            (.stages | type) == "array" and (.stages | length) == 52 and ([.stages[].path] | unique | length) == 52 and all(.stages[]; file and .bytes > 0) and
            (.entries | type) == "array" and (.entries | length) == 3 and [.entries[].entry] == ["ext", "isabs", "report"] and
            all(range(0;3); . as $i | $s.entries[$i] as $e | $e.full_generated as $f |
              all([$e.checked, $e.execute, $e.saved_replay, $e.inputs, $e.native_work_cleanup][]; file) and
              $f.schema == "gooo/path-facts-generated-native-checked/v1" and $f.decision == "FINITE_GENERATED_NATIVE9841_ORIGINAL_GO_PASS" and
              $f.profile == "gooo/path-facts-generated-native9841/v1" and $f.entry == $e.entry and
              $f.activity_id == ["gooo://go/path/Ext", "gooo://go/path/IsAbs", "gooo://go-ports/examples/path-facts/report"][$i] and
              $f.compiler_revision == $s.compiler_revision and $f.go_version == $s.go_version and
              $f.input_count == 9841 and $f.comparison_count == 9841 and $f.generated_native_outputs == 9841 and $f.mismatches == 0 and
              $f.scalar_comparison_count == [9841,9841,59046][$i] and $f.scalar_comparisons == $f.scalar_comparison_count and
              $f.full_cli_transport_outputs == 0 and $f.full_saved_replay_outputs == 0 and
              $f.rows.rows == 9841 and $f.rows.scalar_comparisons == $f.scalar_comparison_count and $f.rows.bytes > 0 and
              $f.rows.bytes == $f.rows_file_bytes and $f.rows.bytes == $f.rows_file.bytes and
              $f.rows.sha256 == $f.rows_file.sha256 and $f.rows.sha256 == $f.rows_sha256 and ($f.rows.sha256 | digest) and
              $f.rows.output_sha256 == $f.rows.oracle_sha256 and ($f.rows.output_sha256 | digest) and ($f.rows.ordered_inputs_sha256 | digest) and
              $f.rows_path == ($out + "/" + $e.entry + "-full/rows.jsonl") and $f.rows_file.path == $f.rows_path and
              all([$f.generated_file, $f.harness_file, $f.process_file, $f.native_report_file, $f.go_path_source_file, $f.go_tool_file][]; file) and
              $f.generated_file.sha256 == $f.generated_sha256 and $f.harness_file.sha256 == $f.harness_sha256 and
              $f.owned_native_work_removed == false and $native[$i].removed == true and $native[$i].all_observed_owned_groups_gone == true and
              $native[$i].owned_path == $f.owned_native_work.path and
              $native[$i].device == $f.owned_native_work.device and $native[$i].inode == $f.owned_native_work.inode and
              $native[$i].checker_checked_report == $e.checked) and
            ([.entries[].full_generated.generated_native_outputs] | add) == 29523 and
            ([.entries[].full_generated.scalar_comparison_count] | add) == 78728 and
            ([.entries[].full_generated.rows.bytes] | add) <= 8388608 and
            ([.entries[].full_generated.rows.ordered_inputs_sha256] | unique | length) == 1 and
            ($ext_cleanup | length) == 1 and ($isabs_cleanup | length) == 1 and ($report_cleanup | length) == 1 and
            ($cleanup | length) == 1 and $cleanup[0].all_top_level_groups_reaped == true and
            ($cleanup[0].owned_inode | type) == "number" and $cleanup[0].owned_inode > 0 and
            ($cleanup[0].logical_bytes_removed | type) == "number" and $cleanup[0].logical_bytes_removed >= 0 and
            ($cleanup[0].owned_path | type) == "string" and ($cleanup[0].owned_path | length) > 0
          ' out/path-facts/summary.json
          test ! -e "$(jq -er '.owned_path' out/path-facts/work-cleanup.json)"
      - name: Retain unsupported-body probes
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          sh tools/probe.sh --out out/probes
      - name: Compare the ports with Go and replay every batch
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          go run ./cmd/verify --workers 2 --case-profile uuid-compact-v1 --out out/ci --timing-out out/ci/timing.jsonl
          jq -e '
            .schema == "gooo/go-ports-differential/v1" and
            .native_suite_workers == 2 and
            .go_version == "go1.27.2" and
            .compiler_revision == "83928fa4538245abe33b08549da47f8cbdc50ed2" and
            .case_profile == {
              schema: "gooo/native-case-profile/v1", name: "uuid-compact-v1",
              compiler_revision: "83928fa4538245abe33b08549da47f8cbdc50ed2", go_version: "go1.27.2",
              entries: ["go/github.com/google/uuid:Validate", "app/uuid-format-inspector:Inspect", "go/github.com/google/uuid/text:ParseCanonical"],
              serializer: "Go1.27.2 json.Marshal(caseDocument(batch)) plus exactly one LF",
              maximum_rows: 128, raw_bytes_including_LF: 30000,
              translated_compact_engine_bytes: 32768, maximum_selected_source_bytes: 10485760,
              lowering_guard: "Pinned839 source-derived nonexpansion upper bound; not measured translated bytes or an actual LoweredName.",
              scope: "Only UUID3 wire bytes/partitions change; original ordered cases, independent expected values, exact workspace and fresh execution/saved replay remain required. No legacy batch total, native-capacity acceptance, full-profile compatibility or speedup is inherited."
            } and
            .ported_functions == 45 and .consumer_programs == 19 and .consumer_activities == 21 and
            .uuid_port_reference_cases == 21745 and .uuid_consumer_reference_cases == 21745 and
            .uuid_parse_reference_cases == 21867 and .uuid_parse_legacy_reference_inputs == 21745 and
            .uuid_parse_anchor_inputs == 136 and .uuid_parse_added_reference_inputs == 122 and
            .uuid_module_revision == "0f11ee6918f41a04c201eceeadf612a377bc7fbc" and
            .uuid_module_h1 == "h1:NIvaJDMOsjHA8n1jAhLSgzrAzy1Hgr+hNrb57e+94F0=" and
            .legacy_cases == 3147 and .unicode_reference_cases == 334 and .unicode_rejection_cases == 12 and
            .color_port_reference_cases == 1300 and .color_port_rejection_cases == 56 and
            .color_consumer_reference_cases == 637 and .color_consumer_rejection_cases == 24 and
            .rotation_port_reference_cases == 2472 and .rotation_port_rejection_cases == 36 and
            .rotation_consumer_reference_cases == 672 and .rotation_consumer_rejection_cases == 36 and
            .duration_port_reference_cases == 3578 and .duration_consumer_reference_cases == 1789 and
            .whitespace_port_reference_cases == 506 and .whitespace_port_rejection_cases == 8 and
            .whitespace_consumer_reference_cases == 506 and .whitespace_consumer_rejection_cases == 8 and
            .classification_port_reference_cases == 5043 and .classification_port_rejection_cases == 24 and
            .classification_consumer_reference_cases == 4570 and .classification_consumer_rejection_cases == 12 and
            .geometry_port_reference_cases == 1711 and .geometry_consumer_reference_cases == 486 and
            .rectangle_in_reference_cases == 570 and .fits_crop_reference_cases == 570 and
            .containment_baseline_reference_inputs == 486 and .containment_added_reference_inputs == 84 and
            .rectangle_in_reference_cases == (.containment_baseline_reference_inputs + .containment_added_reference_inputs) and
            .fits_crop_reference_cases == (.containment_baseline_reference_inputs + .containment_added_reference_inputs) and
            .fixed_port_reference_cases == 1664 and .fixed_port_rejection_cases == 16 and
            .fixed_consumer_reference_cases == 471 and .fixed_consumer_domain_rejection_cases == 33 and
            .fixed_consumer_overflow_rejection_cases == 6 and
            .fixed_oracle_source_sha256 == "b74f2166fce03cecfebb00d3e9641b559dab8ffb00d72139c1dc69ed1ac05725" and
            .canon_port_reference_cases == 371 and .drag_crop_consumer_reference_cases == 501 and
            .simple_fold_port_reference_cases == 3505 and .simple_fold_port_extension_cases == 11 and
            .simple_fold_consumer_reference_cases == 497 and .simple_fold_consumer_rejection_cases == 34 and
            .ycbcr_port_reference_cases == 2160 and .ycbcr_port_rejection_cases == 48 and
            .ycbcr_consumer_reference_cases == 924 and .ycbcr_consumer_rejection_cases == 24 and
            (.ycbcr_exhaustive | keys) == ["RGBToYCbCr", "YCbCrToRGB"] and
            all(.ycbcr_exhaustive[];
              .schema == "gooo/ycbcr-exhaustive-native/v1" and .go_version == "go1.27.2" and
              .input_count == 16777216 and .comparison_count == 16777216 and
              .component_comparison_count == 50331648 and .mismatches == 0 and
              .output_sha256 == .oracle_sha256) and
            .case_mapping_port_reference_cases == 16208 and .case_mapping_port_extension_cases == 198 and
            .case_mapping_invalid_case_reference_cases == 132 and .case_mapping_invalid_case_extension_cases == 132 and
            .case_mapping_consumer_reference_cases == 3602 and .case_mapping_consumer_extension_cases == 11 and
            .nrgba_port_reference_cases == 2696 and .nrgba_port_rejection_cases == 32 and
            .nrgba_consumer_reference_cases == 2158 and .nrgba_consumer_rejection_cases == 104 and
            .string_byte_port_reference_cases == 1536 and .string_byte_port_extension_cases == 16 and
            .string_byte_consumer_reference_cases == 1536 and .string_byte_consumer_extension_cases == 16 and
            .literal_index_reference_cases == 9313 and .literal_count_reference_cases == 9313 and
            .literal_report_reference_cases == 9313 and
            .literal_cut_reference_cases == 32 and .literal_cut_prefix_reference_cases == 32 and
            .literal_cut_suffix_reference_cases == 32 and .literal_cut_report_reference_cases == 32 and
            (.literal_cut_finite_provenance_scope | contains("Inner prior_result_sha256, full generation-report provenance and composition/runtime typed-plan equality are NOT_CHECKED")) and
            (.literal_finite_provenance_scope | contains("Inner prior_result_sha256, full generation-report provenance and composition/runtime typed-plan equality are NOT_CHECKED")) and
            (.case_mapping_exhaustive | keys) == ["To", "ToLower", "ToTitle", "ToUpper"] and
            all(.case_mapping_exhaustive | to_entries[];
              .key == .value.operation and .value.schema == "gooo/case-mapping-exhaustive-native/v1" and
              .value.go_version == "go1.27.2" and .value.unicode_version == "17.0.0" and
              .value.unicode_range_inputs == 1114112 and .value.mismatches == 0) and
            .case_mapping_exhaustive.To.unicode_range_comparisons == 3342336 and
            ([.case_mapping_exhaustive[].unicode_range_comparisons] | add) == 6684672 and
            .cases == 159909 and .passed == 159909 and
            (.runs | length) == 66 and
            ([.runs[].cases] | add) == 159909 and ([.runs[].batches] | add) == 2109 and
            ([.runs[:62][].cases] | add) == 159781 and ([.runs[:62][].batches] | add) == 2104 and
            ([.runs[:59][].cases] | add) == 131842 and ([.runs[:59][].batches] | add) == 1549 and
            ([.runs[:57][].cases] | add) == 130702 and ([.runs[:57][].batches] | add) == 1513 and
            ([.runs[:56][].cases] | add) == 108835 and ([.runs[:56][].batches] | add) == 1274 and
            .runs[54].package == "go/github.com/google/uuid" and .runs[54].activity == "Validate" and
            .runs[54].cases == 21745 and .runs[54].passed == 21745 and .runs[54].batches == 195 and
            .runs[55].package == "app/uuid-format-inspector" and .runs[55].activity == "Inspect" and
            .runs[55].cases == 21745 and .runs[55].passed == 21745 and .runs[55].batches == 197 and
            .runs[56].package == "go/github.com/google/uuid/text" and .runs[56].activity == "ParseCanonical" and
            .runs[56].cases == 21867 and .runs[56].passed == 21867 and .runs[56].batches == 239 and
            .runs[57].package == "go/image" and .runs[57].activity == "RectangleIn" and
            .runs[57].cases == 570 and .runs[57].passed == 570 and .runs[57].batches == 18 and
            .runs[58].package == "example/fits-crop" and .runs[58].activity == "FitsCrop" and
            .runs[58].cases == 570 and .runs[58].passed == 570 and .runs[58].batches == 18 and
            .runs[59].package == "go/strings" and .runs[59].activity == "Index" and
            .runs[59].cases == 9313 and .runs[59].passed == 9313 and .runs[59].batches == 137 and
            .runs[60].package == "go/strings" and .runs[60].activity == "Count" and
            .runs[60].cases == 9313 and .runs[60].passed == 9313 and .runs[60].batches == 137 and
            .runs[61].package == "app/literal-text-report" and .runs[61].activity == "Report" and
            .runs[61].cases == 9313 and .runs[61].passed == 9313 and .runs[61].batches == 281 and
            .runs[62].package == "go/strings" and .runs[62].activity == "Cut" and
            .runs[62].cases == 32 and .runs[62].passed == 32 and .runs[62].batches == 1 and
            .runs[63].package == "go/strings" and .runs[63].activity == "CutPrefix" and
            .runs[63].cases == 32 and .runs[63].passed == 32 and .runs[63].batches == 1 and
            .runs[64].package == "go/strings" and .runs[64].activity == "CutSuffix" and
            .runs[64].cases == 32 and .runs[64].passed == 32 and .runs[64].batches == 1 and
            .runs[65].package == "app/literal-cut-report" and .runs[65].activity == "Report" and
            .runs[65].cases == 32 and .runs[65].passed == 32 and .runs[65].batches == 2 and
            ([.runs[:54][].cases] | add) == 65345 and ([.runs[:54][].batches] | add) == 882 and
            all(.runs[]; .passed == .cases and .replay_equal == true)
          ' out/ci/summary.json
          head -n 1 out/ci/timing.jsonl | jq -e --slurpfile summary out/ci/summary.json '
            . as $header |
            .schema == "gooo/native-verification-timing/v1" and .kind == "header" and .seq == 0 and
            .case_profile == $summary[0].case_profile and
            .compiler_revision == "83928fa4538245abe33b08549da47f8cbdc50ed2" and .go_version == "go1.27.2" and
            .configured_workers == 2 and .expected_suites == 66 and .expected_cases == 159909 and
            .expected_boundaries_recomputed == false and
            .boundary_scope == "Actual contiguous batch coverage is observed. UUID3 use uuid-compact-v1 compact wire bytes and newly selected bounds; no original UUID batch boundaries or legacy2337 total are claimed preserved. Non-UUID suites retain nativeBatchEnd/save behavior. The recorder does not recompute expected partitions." and
            (.identity.source_files | length) == 100 and
            all(["cmd/verify/case_profile.go", "cmd/verify/case_profile_test.go", "cmd/verify/case_profile_integration_test.go"][];
              . as $path | ($header.identity.source_files[$path].bytes | type) == "number" and
              $header.identity.source_files[$path].bytes > 0 and
              ($header.identity.source_files[$path].sha256 | test("^[0-9a-f]{64}$")))
          '
          tail -n 1 out/ci/timing.jsonl | jq -e '
            .schema == "gooo/native-verification-timing/v1" and
            .kind == "run_end" and
            .status == "COMPLETE" and
            .complete == true and .aborted == false and .successful_close_return_required == true and
            .seq == 2242 and
            .expected_suites == 66 and
            .successful_suites == 66 and
            .observed_batches == 2109 and
            .verified_batches == 2109 and
            .verified_cases == 159909 and
            .event_count == 2243 and
            .failed_suites == 0 and
            .canceled_suites == 0 and
            .not_started_suites == 0 and
            .missing_suite_finishes == 0 and
            .failed_batches == 0 and
            .incomplete_batches == 0 and
            .logger_errors == 0 and
            .source_bindings_unchanged == true
          '
          jq -c -s '
            .[0] as $header | .[-1] as $footer |
            [.[] | select(.kind == "batch_end")] as $batches |
            [.[] | select(.kind == "suite_end")] as $suites |
            {
              schema: "gooo/native-verification-timing-summary/v1",
              header: $header,
              footer: ($footer | del(.identity_after)),
              row_count: length,
              sequence_contiguous: (to_entries | all(.[]; .key == .value.seq)),
