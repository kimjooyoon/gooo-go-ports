          jq -e '
            .status == "PASS" and .planned_framework_inputs == 90 and
            .observed_framework_rejections == 90 and .go_reference_cases == 0 and
            .compiler_revision == "83928fa4538245abe33b08549da47f8cbdc50ed2" and
            (.cases | length) == 90 and (.failures | length) == 0 and
            all(.cases[]; .rejection_verified == true and .exit_code == 1 and .timed_out == false)
          ' out/fits-crop-input-rejections/summary.json
      - name: Verify the offline decision-policy experiment
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          ./examples/decision-policy-pilot/run.sh
          pilot_evidence=( "$PWD/examples/decision-policy-pilot/out"/run-* )
          test "${#pilot_evidence[@]}" -eq 1
          go -C examples/decision-policy-pilot vet ./...
          PILOT_EVIDENCE="${pilot_evidence[0]}" \
            go -C examples/decision-policy-pilot test -race -count=1 ./...
          ./examples/decision-policy-pilot/run.sh --verify "${pilot_evidence[0]}"
      - name: Verify the imported CEL API policy
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          go -C examples/cel-api-policy/oracle mod download
          python3 examples/cel-api-policy/verify.py --compiler "$PWD/.gooo" --go "$(go env GOROOT)/bin/go" --out "$PWD/out/cel-api-policy"
          jq -e '.schema == "gooo/cel-public-native-verification/v1" and .status == "FINITE_REAL_CEL_IMPORTED_NATIVE_AND_REPLAY_PASS"' out/cel-api-policy/verification.json
          jq -e '.saved_api_replay.status == "SAME_SOURCE_GENERATION_HISTORICAL_REPLAY_PASS" and .saved_api_replay.independent_cases == 32 and .saved_api_replay.decision_fields_compared == 15 and .saved_api_replay.saved_decision_mutations_rejected == 15 and .saved_api_replay.saved_binding_asset_mutations_rejected == 28 and .saved_api_replay.active_fact_mutations_rejected == 9 and .saved_api_replay.prior_generation_rejected == true and .saved_api_replay.consistent_synthetic_proof_accepted == true and .saved_api_replay.consumer.fresh_process_save_reload_pairs == 2 and .saved_api_replay.consumer.current_provider_calls == 0 and .saved_api_replay.consumer.effect_calls == 0 and .saved_api_replay.consumer.application_state_unchanged == true' out/cel-api-policy/verification.json
      - name: Verify the sealed API policy revision comparison
