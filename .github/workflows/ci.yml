name: Go to Gooo differential verification

on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  observer-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the exact checked PR tree
        id: change-scope
        run: |
          python3 -B tools/classify-ci-scope.py \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --expected-head "$GITHUB_SHA" --summary out/ci-scope.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Check current generation toolchain documentation
        run: |
          python3 -I -B tools/current-toolchain-docs_test.py -v
          python3 -I -B tools/current-toolchain-docs.py --check
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the Go observer
        run: |
          # Upstream UUID archive files stay byte-exact; its added hash wrapper
          # is ours and remains subject to the normal formatter check.
          test -z "$(git ls-files -z '*.go' ':(exclude)third_party/google-uuid/**' | xargs -0 -r gofmt -l)"
          test -z "$(gofmt -l third_party/google-uuid/source_digest.go)"
          go vet ./...
          # Native correctness fixtures run under race checking in this package.
          # Keep a finite package budget above the observed600s default timeout.
          mkdir -p out/observer-tests
          # Stream events while preserving both the Go and log-writer exits.
          if go test -race -timeout=15m -json ./... \
            2> out/observer-tests/stderr.log | tee out/observer-tests/events.jsonl; then
            observer_test_status=("${PIPESTATUS[@]}")
          else
            observer_test_status=("${PIPESTATUS[@]}")
          fi
          if ! printf '%s\n' "${observer_test_status[0]}" > out/observer-tests/exit-code.txt; then
            observer_test_status[1]=1
          fi
          if ! cat out/observer-tests/stderr.log >&2; then
            observer_test_status[1]=1
          fi
          if [ "${observer_test_status[0]}" -ne 0 ]; then
            exit "${observer_test_status[0]}"
          fi
          if [ "${observer_test_status[1]}" -ne 0 ]; then
            exit "${observer_test_status[1]}"
          fi
          go -C examples/automatic-redelivery/reference vet ./...
          go -C examples/automatic-redelivery/reference test -race -count=1 ./...
          python3 -I -B tools/check-redelivery-policy_test.py
          python3 -I -B tools/ipv4_receipts_test.py
          python3 -I -B tools/check-ipv4_test.py
          python3 -I -B tools/prefix_rule_pair_receipts_test.py
          python3 -I -B tools/check-url-components_test.py
          python3 -I -B examples/retry-after-facts/request_inputs_test.py -v
          python3 -I -B examples/retry-after-facts/receipts_test.py -v
          python3 -I -B examples/retry-after-facts/verify_test.py -v
          python3 -I -B tools/generate-rule-pair-corpus.py --check
          python3 -I -B tools/generate-payload-corpus.py --check
          python3 tools/bootstrap.test.py
          python3 tools/receipt_json_test.py
          python3 tools/check-drag-crop-example_test.py
          python3 tools/check-fixed-pixel-bounds_test.py
          python3 -B tools/check-alpha-matte_test.py -v
          python3 -B tools/check-fits-crop_test.py -v
          python3 -B tools/check-fits-crop-inputs_test.py -v
          python3 -B tools/check-literal-text-inputs_test.py -v
          python3 -I -B tools/check-last-index-inputs_test.py -v
          python3 -B tools/classify-ci-scope_test.py -v
          python3 -B tools/check-ci-scope-workflow_test.py -v
          python3 -B tools/check-api-policy-public-consumer_test.py -v
          python3 -I -B tools/api_policy_cli_bundle_test.py -v
          python3 -I -B tools/check-header-addition-host_test.py -v
          python3 -I -B tools/native-shard-reference_test.py -v
          python3 -I -B tools/native_verification_contract_test.py -v
          python3 -I -B examples/versioned-grant-change/verify_test.py
          python3 -I -B examples/editable-api-policy/run_test.py
          # Full scope runs these13 Python controls inside the bounded sidecar once.
          # Documentation-only PRs still run them as common non-native checks.
          if [ "${{ steps.change-scope.outputs.docs_only }}" = "true" ]; then
            python3 -I -B tools/check-path-facts_test.py
          fi
      - name: Check pinned Unicode table generation
        run: |
          go run ./cmd/gen-unicode --check
          go run ./cmd/gen-simple-fold --check
          go run ./cmd/gen-case-mapping --check
          python3 tools/gen-uuid-quote.py --check
      - name: Preserve Go observer test timing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: gooo-go-ports-observer-test-events
          path: |
            out/observer-tests/events.jsonl
            out/observer-tests/stderr.log
            out/observer-tests/exit-code.txt
          if-no-files-found: warn
          retention-days: 7
  native-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Classify the exact checked PR tree
        id: change-scope
        run: |
          python3 -B tools/classify-ci-scope.py \
            --event-name "$GITHUB_EVENT_NAME" --event-path "$GITHUB_EVENT_PATH" \
            --expected-head "$GITHUB_SHA" --summary out/ci-scope.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Verify lightweight API policy summary controls before native work
        if: steps.change-scope.outputs.docs_only != 'true'
        timeout-minutes: 4
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B - <<'PY'
          import ast
          import hashlib
          import json
          import os
          import pathlib
          import stat
          import subprocess
          import sys
          import traceback

          root = pathlib.Path.cwd()
          out = root / 'out/policy-summary-preflight'
          out.mkdir(mode=0o700, parents=True, exist_ok=False)
          names = [
              '.github/workflows/ci.yml',
              'tools/check-ci-scope-workflow_test.py',
              'examples/api-policy-ci/action.yml',
              'examples/api-policy-ci/summary.py',
              'examples/api-policy-ci/check_summary.py',
              'examples/api-policy-ci/check_summary_action.py',
              'examples/api-policy-ci/fixtures/synthetic-write.comparison.json',
          ]


          def save_json(name, value):
              (out / name).write_text(json.dumps(value, indent=2) + '\n', encoding='utf-8')


          def snapshot(label):
              refs = {}
              for name in names:
                  path = root / name
                  info = path.lstat()
                  if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o644:
                      raise ValueError('source mode')
                  raw = path.read_bytes()
                  saved = out / label / name
                  saved.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  saved.write_bytes(raw)
                  saved.chmod(0o600)
                  refs[name] = {'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'mode': '100644'}
              save_json('source-' + label + '.json', refs)
              return refs


          result = {
              'schema': 'gooo/api-policy-summary-native-preflight/v1',
              'status': 'PREFLIGHT_STARTED_NOT_NATIVE_ACCEPTANCE',
              'head': os.environ['GITHUB_SHA'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'python': {'version': sys.version, 'executable': sys.executable},
              'commands': [],
              'source_bindings_unchanged': False,
              'scope': 'Existing16 formatter and2 actual-wrapper transport controls only; no Go, compiler, policy recalculation, native-port or performance acceptance.',
          }
          save_json('result.json', result)
          first_exit = 0
          before = None
          try:
              before = snapshot('before')
              head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
              if head != result['head']:
                  raise ValueError('source head')
              methods = {}
              for name, count in [('check_summary.py', 16), ('check_summary_action.py', 2)]:
                  tree = ast.parse((root / 'examples/api-policy-ci' / name).read_text(encoding='utf-8'))
                  found = sorted(node.name for node in ast.walk(tree)
                                 if isinstance(node, ast.FunctionDef) and node.name.startswith('test_'))
                  if len(found) != count or len(set(found)) != count:
                      raise ValueError('control roster')
                  methods[name] = found
              result['test_methods'] = methods
              commands = [
                  ('summary-controls', [sys.executable, '-I', '-B', 'examples/api-policy-ci/check_summary.py',
                                        str(root / 'examples/api-policy-ci/summary.py')]),
                  ('summary-action-controls', [sys.executable, '-I', '-B', 'examples/api-policy-ci/check_summary_action.py',
                                               str(root / 'examples/api-policy-ci/action.yml'),
                                               str(root / 'examples/api-policy-ci/summary.py'),
                                               str(root / 'examples/api-policy-ci/fixtures/synthetic-write.comparison.json')]),
              ]
              for label, command in commands:
                  argv = ['timeout', '--signal=TERM', '--kill-after=5s', '90s'] + command
                  with (out / (label + '.stdout')).open('xb') as stdout, (out / (label + '.stderr')).open('xb') as stderr:
                      completed = subprocess.run(argv, cwd=root, stdin=subprocess.DEVNULL,
                                                 stdout=stdout, stderr=stderr, check=False)
                  result['commands'].append({'label': label, 'argv': argv, 'exit_code': completed.returncode})
                  save_json('result.json', result)
                  if completed.returncode != 0:
                      first_exit = completed.returncode if 0 < completed.returncode < 256 else 2
                      result['first_failure'] = label
                      break
          except Exception:
              traceback.print_exc()
              if not first_exit:
                  first_exit = 2
              result.setdefault('first_failure', 'source-or-controller')
          finally:
              try:
                  after = snapshot('after')
                  result['source_bindings_unchanged'] = before is not None and before == after
              except Exception:
                  traceback.print_exc()
                  result['source_bindings_unchanged'] = False
              if not result['source_bindings_unchanged']:
                  if not first_exit:
                      first_exit = 2
                  result.setdefault('first_failure', 'source-after')
              result['status'] = ('SUMMARY_CONTROLS_PASS_NOT_NATIVE_ACCEPTANCE' if not first_exit
                                  else 'SUMMARY_PREFLIGHT_FAILED_FIRST_OBSERVATION_PRESERVED')
              result['exit_code'] = first_exit
              save_json('result.json', result)
          print(result['status'])
          raise SystemExit(first_exit)
          PY
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and identify the pinned compiler from a clean checkout
        run: |
          mkdir -p out
          sh tools/bootstrap.sh
          ./.gooo version --build --json > out/compiler-build.json
          jq -e '
            .version == "0.6.37-dev" and
            .compiler_source_sha == "205896a413e5dea92366309c35ae85e542d055f6" and
            .source_status == "CLEAN_VCS" and .vcs_modified == "false" and
            .go_version == "go1.27.3" and .native_go_required == "go1.27.3"
          ' out/compiler-build.json
      - name: Check Gooo declarations
        run: |
          ./.gooo check ports/net/http.gooo
