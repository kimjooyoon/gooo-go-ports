name: Go to Gooo differential verification

on: [push, pull_request]

permissions:
  contents: read

jobs:
  native-ports:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Check the Go observer
        run: |
          test -z "$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)"
          go vet ./...
          go test -race ./...
          python3 tools/bootstrap.test.py
      - name: Build and identify the pinned compiler from a clean checkout
        run: |
          mkdir -p out
          sh tools/bootstrap.sh
          ./.gooo version --build --json > out/compiler-build.json
          jq -e '
            .version == "0.6.24-dev" and
            .compiler_source_sha == "366ee6ef8f9d2b9b57331dfd26b6f908c0289851" and
            .source_status == "CLEAN_VCS" and .vcs_modified == "false" and
            .go_version == "go1.27.2" and .native_go_required == "go1.27.2"
          ' out/compiler-build.json
      - name: Check Gooo declarations and retain unsupported-body probes
        run: |
          ./.gooo check ports/net/http.gooo
          ./.gooo check ports/unicode/utf8.gooo
          ./.gooo check ports/unicode/utf16.gooo
          ./.gooo check ports/unicode/space.gooo
          ./.gooo check ports/math/bits.gooo
          ./.gooo check ports/image/color.gooo
          ./.gooo check ports/time/duration.gooo
          sh tools/probe.sh --out out/probes
      - name: Compare the ports with Go and replay every batch
        run: |
          go run ./cmd/verify --out out/ci
          jq -e '
            .schema == "gooo/go-ports-differential/v1" and
            .go_version == "go1.27.2" and
            .compiler_revision == "366ee6ef8f9d2b9b57331dfd26b6f908c0289851" and
            .ported_functions == 19 and .consumer_programs == 7 and .consumer_activities == 8 and
            .legacy_cases == 3147 and .unicode_reference_cases == 334 and .unicode_rejection_cases == 12 and
            .color_port_reference_cases == 1300 and .color_port_rejection_cases == 56 and
            .color_consumer_reference_cases == 637 and .color_consumer_rejection_cases == 24 and
            .rotation_port_reference_cases == 2472 and .rotation_port_rejection_cases == 36 and
            .rotation_consumer_reference_cases == 672 and .rotation_consumer_rejection_cases == 36 and
            .duration_port_reference_cases == 3578 and .duration_consumer_reference_cases == 1789 and
            .whitespace_port_reference_cases == 506 and .whitespace_port_rejection_cases == 8 and
            .whitespace_consumer_reference_cases == 506 and .whitespace_consumer_rejection_cases == 8 and
            .cases == 15121 and .passed == 15121 and
            (.runs | length) == 27 and
            ([.runs[].cases] | add) == 15121 and ([.runs[].batches] | add) == 182 and
            all(.runs[]; .passed == .cases and .replay_equal == true)
          ' out/ci/summary.json
      - name: Execute and replay the input-only importing example
        run: |
          ./.gooo package execute --json --inputs examples/inputs.json \
            gooo.workspace.json > out/example.json
          ./.gooo package replay --json --receipt out/example.json \
            --inputs examples/inputs.json gooo.workspace.json > out/example-replay.json
          jq -e --slurpfile fixture examples/inputs.json '
            .decision == "OBSERVED" and
            .result.runtime.finite_total == 0 and .result.runtime.finite_passed == 0 and
            .result.runtime.projection_replayed == true and
            .result.runtime.runtime_replayed == true and
            .result.runtime.model_calls == 0 and
            (.result.runtime.traces | length) == ($fixture[0].inputs | length)
          ' out/example.json out/example-replay.json
          jq -e '
            .result.replay.model_calls == 0 and
            (.replayed_from_sha256 | startswith("sha256:"))
          ' out/example-replay.json
          jq -s -e '
            .[0].result.composition.generated_sha256 == .[1].result.composition.generated_sha256 and
            ([.[0].result.runtime.traces[].deliveries[] | {input, inputs, actual}] ==
             [.[1].result.runtime.traces[].deliveries[] | {input, inputs, actual}])
          ' out/example.json out/example-replay.json
      - name: Execute and replay the byte-summary input-only example
        run: |
          ./.gooo package execute --json --inputs examples/byte-summary/inputs.json \
            byte-summary.workspace.json > out/byte-example.json
          ./.gooo package replay --json --receipt out/byte-example.json \
            --inputs examples/byte-summary/inputs.json byte-summary.workspace.json > out/byte-replay.json
          jq -e --slurpfile fixture examples/byte-summary/inputs.json '
            .decision == "OBSERVED" and
            .result.runtime.finite_total == 0 and .result.runtime.finite_passed == 0 and
            .result.runtime.projection_replayed == true and
            .result.runtime.runtime_replayed == true and
            .result.runtime.model_calls == 0 and
            (.result.runtime.traces | length) == ($fixture[0].inputs | length)
          ' out/byte-example.json out/byte-replay.json
          jq -e '
            .result.replay.model_calls == 0 and
            (.replayed_from_sha256 | startswith("sha256:"))
          ' out/byte-replay.json
          jq -s -e '
            .[0].result.composition.generated_sha256 == .[1].result.composition.generated_sha256 and
            ([.[0].result.runtime.traces[].deliveries[] | {input, inputs, actual}] ==
             [.[1].result.runtime.traces[].deliveries[] | {input, inputs, actual}])
          ' out/byte-example.json out/byte-replay.json
      - name: Execute and replay the byte-rotation input-only example
        run: |
          ./.gooo package execute --json --inputs examples/byte-rotation/inputs.json \
            byte-rotation.workspace.json > out/rotation-example.json
          ./.gooo package replay --json --receipt out/rotation-example.json \
            --inputs examples/byte-rotation/inputs.json \
            byte-rotation.workspace.json > out/rotation-replay.json
          jq -e --slurpfile fixture examples/byte-rotation/inputs.json '
            .decision == "OBSERVED" and
            .result.runtime.finite_total == 0 and .result.runtime.finite_passed == 0 and
            .result.runtime.projection_replayed == true and .result.runtime.runtime_replayed == true and
            .result.runtime.model_calls == 0 and
            (.result.runtime.traces | length) == ($fixture[0].inputs | length)
          ' out/rotation-example.json out/rotation-replay.json
          jq -e '.result.replay.model_calls == 0 and (.replayed_from_sha256 | startswith("sha256:"))' \
            out/rotation-replay.json
          # Python preserves every integer, including rotations outside JSON's binary64-safe range.
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          fixture = json.loads(Path("examples/byte-rotation/inputs.json").read_bytes())
          execution_bytes = Path("out/rotation-example.json").read_bytes()
          execution = json.loads(execution_bytes)
          replay = json.loads(Path("out/rotation-replay.json").read_bytes())
          assert replay["replayed_from_sha256"] == "sha256:" + hashlib.sha256(execution_bytes).hexdigest()
          assert execution["result"]["composition"]["generated_sha256"] == replay["result"]["composition"]["generated_sha256"]
          deliveries = lambda receipt: [d for t in receipt["result"]["runtime"]["traces"] for d in t["deliveries"]]
          actual = deliveries(execution)
          repeated = deliveries(replay)
          assert len(actual) == len(repeated) == len(fixture["inputs"])
          for supplied, observed, rerun in zip(fixture["inputs"], actual, repeated):
              expected_inputs = [
                  {"port": "input0", "entity_id": "gooo://std/integer", "value": supplied["app/byte-rotation:Inspect.input0"]},
                  {"port": "input1", "entity_id": "gooo://std/integer", "value": supplied["app/byte-rotation:Inspect.input1"]},
              ]
              assert observed["activity_id"] == rerun["activity_id"] == "gooo://go-ports/examples/byte-rotation/inspect"
              assert observed["inputs"] == rerun["inputs"] == expected_inputs
              assert observed["actual"] == rerun["actual"]
          PY
      - name: Execute and replay Unicode inspector input-only examples
        run: |
          for kind in scalar pair; do
            inputs="examples/unicode-inspector/${kind}-inputs.json"
            ./.gooo package execute --json --inputs "$inputs" \
              "unicode-${kind}.workspace.json" > "out/unicode-${kind}.json"
            ./.gooo package replay --json --receipt "out/unicode-${kind}.json" \
              --inputs "$inputs" "unicode-${kind}.workspace.json" > "out/unicode-${kind}-replay.json"
            jq -e --slurpfile fixture "$inputs" '
              .decision == "OBSERVED" and
              .result.runtime.finite_total == 0 and .result.runtime.finite_passed == 0 and
              .result.runtime.projection_replayed == true and .result.runtime.runtime_replayed == true and
              .result.runtime.model_calls == 0 and
              (.result.runtime.traces | length) == ($fixture[0].inputs | length)
            ' "out/unicode-${kind}.json" "out/unicode-${kind}-replay.json"
            jq -e '.result.replay.model_calls == 0 and (.replayed_from_sha256 | startswith("sha256:"))' \
              "out/unicode-${kind}-replay.json"
            jq -s -e '
              .[0].result.composition.generated_sha256 == .[1].result.composition.generated_sha256 and
              ([.[0].result.runtime.traces[].deliveries[] | {input, inputs, actual}] ==
               [.[1].result.runtime.traces[].deliveries[] | {input, inputs, actual}])
            ' "out/unicode-${kind}.json" "out/unicode-${kind}-replay.json"
          done
      - name: Execute and replay the color inspector input-only example
        run: |
          ./.gooo package execute --json --inputs examples/color-inspector/inputs.json \
            color-inspector.workspace.json > out/color-example.json
          ./.gooo package replay --json --receipt out/color-example.json \
            --inputs examples/color-inspector/inputs.json \
            color-inspector.workspace.json > out/color-replay.json
          jq -e --slurpfile fixture examples/color-inspector/inputs.json '
            .decision == "OBSERVED" and
            .result.runtime.finite_total == 0 and .result.runtime.finite_passed == 0 and
            .result.runtime.projection_replayed == true and .result.runtime.runtime_replayed == true and
            .result.runtime.model_calls == 0 and
            (.result.runtime.traces | length) == ($fixture[0].inputs | length)
          ' out/color-example.json out/color-replay.json
          jq -e '.result.replay.model_calls == 0 and (.replayed_from_sha256 | startswith("sha256:"))' \
            out/color-replay.json
          jq -s -e '
            .[0].result.composition.generated_sha256 == .[1].result.composition.generated_sha256 and
            ([.[0].result.runtime.traces[].deliveries[] | {input, inputs, actual}] ==
             [.[1].result.runtime.traces[].deliveries[] | {input, inputs, actual}])
          ' out/color-example.json out/color-replay.json
      - name: Execute and replay the duration quantizer input-only example
        run: |
          ./.gooo package execute --json --inputs examples/duration-quantizer/inputs.json \
            duration-quantizer.workspace.json > out/duration-example.json
          ./.gooo package replay --json --receipt out/duration-example.json \
            --inputs examples/duration-quantizer/inputs.json \
            duration-quantizer.workspace.json > out/duration-replay.json
          # Preserve int64 nanoseconds while checking input and saved-replay bindings.
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          digest = lambda value: "sha256:" + hashlib.sha256(value).hexdigest()
          fixture_bytes = Path("examples/duration-quantizer/inputs.json").read_bytes()
          fixture = json.loads(fixture_bytes)
          manifest_bytes = Path("duration-quantizer.workspace.json").read_bytes()
          lock = json.loads(Path("upstream.json").read_bytes())
          execution_bytes = Path("out/duration-example.json").read_bytes()
          execution = json.loads(execution_bytes)
          replay = json.loads(Path("out/duration-replay.json").read_bytes())
          assert replay["replayed_from_sha256"] == "sha256:" + hashlib.sha256(execution_bytes).hexdigest()
          assert execution["result"]["composition"]["generated_sha256"] == replay["result"]["composition"]["generated_sha256"]
          assert replay["result"]["replay"]["model_calls"] == 0
          results = []
          for receipt in (execution, replay):
              runtime = receipt["result"]["runtime"]
              composition = receipt["result"]["composition"]
              assert receipt["decision"] == "OBSERVED"
              assert receipt["schema"] == "gooo/workspace-body-execution-receipt/v1"
              assert runtime["schema"] == "gooo/body-composition-runtime/v1" and runtime.get("failure") is None
              assert receipt["inputs_digest"] == digest(fixture_bytes)
              assert receipt["manifest_digest"] == digest(manifest_bytes)
              assert composition["stage"] == runtime["stage"] == "COMPLETE"
              assert composition["generated_sha256"] == runtime["generated_sha256"] == digest(composition["source"].encode())
              assert runtime["producer_source_sha"] == lock["compiler_revision"]
              version = runtime["go_version"].split()
              assert len(version) == 4 and version[:3] == ["go", "version", lock["go_version"]]
              for step in composition["steps"]:
                  assert step["generation"]["report"]["compiler_source_sha"] == lock["compiler_revision"]
              assert runtime["finite_total"] == runtime["finite_passed"] == runtime["model_calls"] == 0
              assert runtime["projection_replayed"] is True and runtime["runtime_replayed"] is True
              deliveries = [d for t in runtime["traces"] for d in t["deliveries"]]
              assert len(deliveries) == len(fixture["inputs"])
              for supplied, observed in zip(fixture["inputs"], deliveries):
                  assert observed["activity_id"] == "gooo://go-ports/examples/duration-quantizer/inspect"
                  assert observed["inputs"] == [
                      {"port": "input0", "entity_id": "gooo://std/integer", "value": supplied["app/duration-quantizer:Inspect.input0"]},
                      {"port": "input1", "entity_id": "gooo://std/integer", "value": supplied["app/duration-quantizer:Inspect.input1"]},
                  ]
                  assert set(observed["actual"]) == {"rounded", "truncated", "round_adjustment", "truncation_remainder"}
                  assert all(type(v) is int and -(2**63) <= v < 2**63 for v in observed["actual"].values())
              results.append([d["actual"] for d in deliveries])
          assert results[0] == results[1]
          PY
      - name: Execute and replay the whitespace inspector input-only example
        run: |
          ./.gooo package execute --json --inputs examples/whitespace-inspector/inputs.json \
            whitespace-inspector.workspace.json > out/whitespace-example.json
          ./.gooo package replay --json --receipt out/whitespace-example.json \
            --inputs examples/whitespace-inspector/inputs.json \
            whitespace-inspector.workspace.json > out/whitespace-replay.json
          # JSON integers, source bindings and semantic record fields remain exact.
          python3 - <<'PYTHON'
          import hashlib
          import json
          from pathlib import Path

          digest = lambda raw: "sha256:" + hashlib.sha256(raw).hexdigest()
          fixture_bytes = Path("examples/whitespace-inspector/inputs.json").read_bytes()
          fixture = json.loads(fixture_bytes)
          manifest_bytes = Path("whitespace-inspector.workspace.json").read_bytes()
          manifest = json.loads(manifest_bytes)
          source_names = {p["path"]: p["sources"][0] for p in manifest["packages"]}
          fields = ["in_rune_domain", "valid_scalar", "is_go_space", "is_ascii_space", "utf8_bytes", "utf16_units"]
          entity = "gooo://go-ports/examples/whitespace-inspector/inspection"
          lock = json.loads(Path("upstream.json").read_bytes())
          original = Path("out/whitespace-example.json").read_bytes()
          execution = json.loads(original)
          replay = json.loads(Path("out/whitespace-replay.json").read_bytes())
          assert replay["replayed_from_sha256"] == digest(original)
          assert replay["result"]["replay"]["model_calls"] == 0
          for receipt in (execution, replay):
              assert receipt["schema"] == "gooo/workspace-body-execution-receipt/v1" and receipt["decision"] == "OBSERVED"
              assert receipt["manifest_digest"] == digest(manifest_bytes) and receipt["inputs_digest"] == digest(fixture_bytes)
              result = receipt["result"]
              assert result["program"]["entry"]["package_path"] == "app/whitespace-inspector"
              assert result["program"]["entry"]["activity"] == "Inspect"
              packages = result["program"]["workspace_image"]["packages"]
              assert len(packages) == 4 and {p["path"] for p in packages} == set(source_names)
              for package in packages:
                  filename = source_names[package["path"]]
                  text = Path(filename).read_text()
                  encoded = json.dumps(text, ensure_ascii=False).replace("&", "\\u0026").replace("<", "\\u003c").replace(">", "\\u003e").encode()
                  assert len(package["sources"]) == 1
                  assert package["sources"][0]["filename"] == filename
                  assert package["sources"][0]["source_digest"] == digest(encoded)
                  if package["path"] == "app/whitespace-inspector":
                      export = [e for e in package["exports"] if e["name"] == "Inspect"]
                      assert len(export) == 1 and export[0]["id"] == "gooo://go-ports/examples/whitespace-inspector/inspect"
                      assert export[0]["input_types"] == ["gooo://std/integer"] and export[0]["output_type"] == entity
              runtime, composition = result["runtime"], result["composition"]
              assert runtime["stage"] == composition["stage"] == "COMPLETE" and runtime.get("failure") is None
              assert runtime["producer_source_sha"] == lock["compiler_revision"]
              assert runtime["go_version"].split()[:3] == ["go", "version", lock["go_version"]]
              assert runtime["generated_sha256"] == composition["generated_sha256"] == digest(composition["source"].encode())
              assert runtime["finite_total"] == runtime["finite_passed"] == runtime["model_calls"] == 0
              assert runtime["projection_replayed"] and runtime["runtime_replayed"]
              assert len(runtime["traces"]) == len(fixture["inputs"]) == 21
              for index, (supplied, trace) in enumerate(zip(fixture["inputs"], runtime["traces"])):
                  assert trace["case_index"] == index and len(trace["deliveries"]) == 1
                  delivery = trace["deliveries"][0]
                  assert delivery["activity_id"] == "gooo://go-ports/examples/whitespace-inspector/inspect"
                  assert delivery["input"] == supplied["app/whitespace-inspector:Inspect"]
                  actual = delivery["actual"]
                  assert set(actual) == set(fields)
                  assert all(type(actual[f]) is bool for f in fields[:4])
                  assert all(type(actual[f]) is int for f in fields[4:])
                  assert delivery["actual_fields"] == [{"id": entity + "/" + f.replace("_", "-"), "name": f, "value": actual[f]} for f in fields]
          assert execution["result"]["runtime"]["traces"] == replay["result"]["runtime"]["traces"]
          assert execution["result"]["composition"]["source"] == replay["result"]["composition"]["source"]
          PYTHON
      - name: Upload execution and diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gooo-go-ports-evidence
          path: out/
          if-no-files-found: warn
          retention-days: 14

  browser-demo:
    needs: native-ports
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.2'
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Build the actual Gooo composition for the browser
        run: |
          node --test tools/*.test.cjs
          sh tools/bootstrap.sh
          go run ./cmd/build-demo --out out/browser
          node tools/browser-smoke.cjs out/browser/site | tee out/browser/smoke.json
          node tools/text-inspector-smoke.cjs out/browser/site | tee out/browser/text-inspector-smoke.json
        shell: bash --noprofile --norc -e -o pipefail {0}
      - name: Preserve the tested site and provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-demo
          path: out/browser/
          retention-days: 14
      - name: Package the verified main-branch site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: out/browser/site

  deploy-browser-demo:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser-demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the tested browser demo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
