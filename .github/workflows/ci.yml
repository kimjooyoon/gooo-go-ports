            .schema == "gooo/literal-text-report-checked/v1" and
            .decision == "PASS_FINITE_GO_ORACLE_AND_SAVED_REPLAY" and
            .compiler_revision == "205896a413e5dea92366309c35ae85e542d055f6" and
            .compiler_version == "0.6.37-dev" and .go_version == "go1.27.3" and
            .native_observed_cases == 24 and .independent_go_oracle_cases == 24 and
            .saved_replay_observed_cases == 24 and .native_receipt_expectation_cases == 0 and
            (.results | length) == 24 and
            (.source_bindings | keys) == ["examples/literal-text-report/main.gooo", "ports/strings/literal.gooo", "ports/strings/search.gooo"] and
            all(.source_bindings[]; .source_digest | sha) and
            all([.manifest_digest, .inputs_digest, .execution_sha256, .replay_sha256,
                 .prior_result_sha256, .generated_sha256, .driver_sha256][]; sha)
          ' out/literal-text-report/checked-report.json
      - name: Observe malformed literal Text inputs through the actual CLI
