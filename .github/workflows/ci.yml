      - name: Verify the original automatic redelivery policy
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python3 -B tools/check-redelivery-policy.py --repository . --out out/redelivery-policy --go "$(go env GOROOT)/bin/go" --compiler ./.gooo --timeout 300
          python3 -I - <<'PY'
          from pathlib import Path
          from decimal import Decimal
          import hashlib, json, re
          root = Path("out/redelivery-policy").resolve()
          def unique(pairs):
              value = {}
              for key, item in pairs:
                  if key in value: raise ValueError("duplicate metadata key")
                  value[key] = item
              return value
          def no_float(_): raise ValueError("integer metadata token required")
          def read(path, diagnostics=False):
              return json.loads(Path(path).read_bytes().decode("utf-8"), object_pairs_hook=unique,
                  parse_float=Decimal if diagnostics else no_float, parse_constant=no_float)
          def exact(value, expected):
              return type(value) is type(expected) and value == expected
          seen = set()
          def rawref(value, present=True):
              assert type(value) is dict and set(value) == {"path", "bytes", "sha256"}
              path, size, sha = value["path"], value["bytes"], value["sha256"]
              assert type(path) is str and Path(path).is_absolute()
              assert type(size) is int and 0 <= size <= 128 << 20
              assert type(sha) is str and re.fullmatch("[0-9a-f]{64}", sha)
              if not present: return Path(path)
              p = Path(path)
              assert p.resolve(strict=True) == p and not p.is_symlink() and p.is_file()
              assert p.stat().st_size == size
              digest = hashlib.sha256()
              with p.open("rb") as stream:
                  for block in iter(lambda: stream.read(1 << 20), b""): digest.update(block)
              assert digest.hexdigest() == sha
              seen.add(path)
              return p
          s = read(root / "summary.json")
          assert s["schema"] == "gooo/redelivery-public-two-layer-CI/v1"
          assert s["status"] == "FRESH_MANUAL16_REPLAY_AND_FULL12288_GENERATED_NATIVE_PASS"
          assert s["compiler_revision"] == "205896a413e5dea92366309c35ae85e542d055f6" and s["go_version"] == "go1.27.3"
          assert s["contract_sha256"] == "e9dadc2b2bfe776648b216477ffd9cfe7b23ee0deaf2b22bd3ab27c268acdac0"
          counts = {"top_level_stages":70, "manual_execute_outputs":16, "manual_saved_replay_outputs":16,
              "manual_reason_count":13, "typed_fields_compared_per_phase":240, "echo_values_compared_per_phase":144,
              "generated_native_outputs":12288, "generated_native_scalar_comparisons":184320, "generated_native_echo_comparisons":110592,
              "readback_outputs":12288, "readback_scalar_comparisons":184320, "readback_echo_comparisons":110592,
              "full_CLI_outputs":0, "full_saved_replay_outputs":0, "native_receipt_expectation_cases":0,
              "strict_transport_refusals":36, "receipt_tamper_refusals":18, "automatic_retries":0}
          assert all(exact(s.get(k), v) for k, v in counts.items())
          for key in ("source_freeze", "oracle", "oracle_origin", "work_cleanup"): rawref(s[key])
          freeze = read(rawref(s["source_freeze"]))
          assert freeze["schema"] == "gooo/redelivery-public-runtime-source-freeze/v1"
          assert freeze["repository_root"] == str(Path.cwd().resolve()) and exact(freeze["overall_seconds"],300)
          for key in ("files", "tools"):
              refs = freeze[key]
              assert type(refs) is list and 0 < len(refs) <= 256 and len({r["path"] for r in refs}) == len(refs)
              for item in refs: rawref(item)
          full = s["full"]
          assert set(full) == {"checked", "rows", "boundary", "generated", "origin"}
          for key in ("checked", "boundary", "generated", "origin"): rawref(full[key])
          f = read(rawref(full["checked"]))
          assert f["schema"] == "gooo/redelivery-full-domain-generated-native/v1" and f["decision"] == "FULL12288_GENERATED_NATIVE_VALUES_MATCHED"
          assert f["contract_sha256"] == s["contract_sha256"] and f["go_version"] == s["go_version"]
          for key, value in {"input_count":12288,"generated_function_calls":12288,"oracle_evaluations":12288,
              "typed_field_comparisons":184320,"echo_value_comparisons":110592,"mismatches":0,
              "readback_row_count":12288,"readback_oracle_evaluations":12288,"readback_typed_field_comparisons":184320,
              "readback_echo_value_comparisons":110592,"readback_mismatches":0,"full_CLI_cases":0,"full_saved_replay_cases":0}.items():
