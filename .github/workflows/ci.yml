      - name: Verify the original native Retry-After facts sidecar
        if: steps.change-scope.outputs.docs_only != 'true'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python3 -I -B examples/retry-after-facts/verify.py --root "$PWD" --compiler "$PWD/.gooo" --go "$(go env GOROOT)/bin/go" --out "$PWD/out/retry-after-facts"
          jq -e '
            .schema == "gooo/retry-after-facts-verification/v1" and
            .status == "NATIVE_ORACLE_AND_SAVED_REPLAY_MATCH" and
            .cases == 113 and .batches == 2 and
            .typed_fields_per_phase == 1582 and .input_scalar_checks_per_phase == 678 and
            .native_runs_per_phase == 4 and
            (.negative_controls | length) == 11 and ([.negative_controls[].name] | unique | length) == 11 and
            all(.negative_controls[]; .status == "REFUSED_AT_EXPECTED_BOUNDARY") and
            .starter_gate_bound == true and .starter_case_index == 4 and
            .processes_closed == true and .owned_work_removed == true and
            .model_calls == 0 and .finite_total == 0 and
            .native_acceptance == false and .catalog_extended == false and .producer_authenticated == false
          ' out/retry-after-facts/summary.json
      - name: Verify the isolated native path facts sidecar
        if: steps.change-scope.outputs.docs_only != 'true'
        run: |
          python3 -B tools/check-path-facts.py --repository . --out out/path-facts --go "$(go env GOROOT)/bin/go" --compiler ./.gooo --timeout 300
          jq -e --arg out "$PWD/out/path-facts" \
            --slurpfile cleanup out/path-facts/work-cleanup.json \
            --slurpfile ext_cleanup out/path-facts/ext-native-work-cleanup.json \
            --slurpfile isabs_cleanup out/path-facts/isabs-native-work-cleanup.json \
            --slurpfile report_cleanup out/path-facts/report-native-work-cleanup.json '
            def digest: type == "string" and test("^(sha256:)?[0-9a-f]{64}$");
            def file: type == "object" and (.path | type) == "string" and
              (.bytes | type) == "number" and .bytes >= 0 and (.sha256 | digest);
            . as $s | [$ext_cleanup[0], $isabs_cleanup[0], $report_cleanup[0]] as $native |
            .schema == "gooo/path-facts-two-layer-CI/v1" and
            .status == "MANUAL24_CLI_REPLAY_AND_FULL9841_GENERATED_NATIVE_PASS" and
            .compiler_revision == "205896a413e5dea92366309c35ae85e542d055f6" and .go_version == "go1.27.3" and
            .manual_input_count_per_entry == 24 and .manual_entry_count == 3 and
            .manual_execute_outputs == 72 and .manual_saved_replay_outputs == 72 and
            .generated_native_input_count_per_entry == 9841 and .generated_native_entry_outputs == 29523 and
            .generated_native_scalar_comparisons == 78728 and .full_CLI_outputs == 0 and .full_saved_replay_outputs == 0 and
            .strict_transport_refusals == 15 and .receipt_tamper_refusals == 18 and .native_receipt_expectation_cases == 0 and
            (.source_freeze | file) and (.original_Go_manual_oracle | file) and (.work_cleanup | file) and
            (.stages | type) == "array" and (.stages | length) == 52 and ([.stages[].path] | unique | length) == 52 and all(.stages[]; file and .bytes > 0) and
            (.entries | type) == "array" and (.entries | length) == 3 and [.entries[].entry] == ["ext", "isabs", "report"] and
            all(range(0;3); . as $i | $s.entries[$i] as $e | $e.full_generated as $f |
              all([$e.checked, $e.execute, $e.saved_replay, $e.inputs, $e.native_work_cleanup][]; file) and
              $f.schema == "gooo/path-facts-generated-native-checked/v1" and $f.decision == "FINITE_GENERATED_NATIVE9841_ORIGINAL_GO_PASS" and
              $f.profile == "gooo/path-facts-generated-native9841/v1" and $f.entry == $e.entry and
              $f.activity_id == ["gooo://go/path/Ext", "gooo://go/path/IsAbs", "gooo://go-ports/examples/path-facts/report"][$i] and
              $f.compiler_revision == $s.compiler_revision and $f.go_version == $s.go_version and
              $f.input_count == 9841 and $f.comparison_count == 9841 and $f.generated_native_outputs == 9841 and $f.mismatches == 0 and
              $f.scalar_comparison_count == [9841,9841,59046][$i] and $f.scalar_comparisons == $f.scalar_comparison_count and
              $f.full_cli_transport_outputs == 0 and $f.full_saved_replay_outputs == 0 and
              $f.rows.rows == 9841 and $f.rows.scalar_comparisons == $f.scalar_comparison_count and $f.rows.bytes > 0 and
              $f.rows.bytes == $f.rows_file_bytes and $f.rows.bytes == $f.rows_file.bytes and
              $f.rows.sha256 == $f.rows_file.sha256 and $f.rows.sha256 == $f.rows_sha256 and ($f.rows.sha256 | digest) and
              $f.rows.output_sha256 == $f.rows.oracle_sha256 and ($f.rows.output_sha256 | digest) and ($f.rows.ordered_inputs_sha256 | digest) and
              $f.rows_path == ($out + "/" + $e.entry + "-full/rows.jsonl") and $f.rows_file.path == $f.rows_path and
              all([$f.generated_file, $f.harness_file, $f.process_file, $f.native_report_file, $f.go_path_source_file, $f.go_tool_file][]; file) and
              $f.generated_file.sha256 == $f.generated_sha256 and $f.harness_file.sha256 == $f.harness_sha256 and
              $f.owned_native_work_removed == false and $native[$i].removed == true and $native[$i].all_observed_owned_groups_gone == true and
              $native[$i].owned_path == $f.owned_native_work.path and
              $native[$i].device == $f.owned_native_work.device and $native[$i].inode == $f.owned_native_work.inode and
              $native[$i].checker_checked_report == $e.checked) and
            ([.entries[].full_generated.generated_native_outputs] | add) == 29523 and
            ([.entries[].full_generated.scalar_comparison_count] | add) == 78728 and
            ([.entries[].full_generated.rows.bytes] | add) <= 8388608 and
