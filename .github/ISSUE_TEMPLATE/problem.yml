name: Loading, setup, or function problem
description: Report a failed first run or an unexpected result in the demos, text inspector, crop planner, or native ports.
body:
  - type: markdown
    attributes:
      value: |
        Describe where you got stuck. A working demo, shared input link, inspection report, or build metadata is not required.
        English and Korean reports are welcome. Inspection JSON contains the exact original text. Review any text, files, or logs you choose to share before submitting this public issue. Nothing is attached or submitted automatically.
  - type: dropdown
    id: entry-point
    attributes:
      label: Where did you try it?
      options:
        - Public browser demo
        - Unicode text inspector
        - Rectangle crop planner
        - Downloaded browser demo
        - Native setup, verification, or replay
        - Another path
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Page URL or command and steps
      description: For a function result, include its name and exact input if you reached that point. For a text inspection, describe your steps and include only input you choose to make public. For a loading failure, the page address is enough.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened, and what did you expect?
      description: Copy the visible error or actual result. Say what you expected if you know; a screenshot is also useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system, if known
      description: For a native run, include your Go version if available.
  - type: input
    id: version
    attributes:
      label: Release version or port revision, if known
      description: The archive name or the demo's Port revision can help. Leave this blank if loading failed.
  - type: textarea
    id: supporting-details
    attributes:
      label: Shared input link, inspection report, or additional details (optional)
      description: The function demo offers Copy link to this input; include its actual result above. A completed text inspection offers Download inspection JSON, which includes the exact original text and results. Review any file before sharing it publicly. Logs and build metadata are optional.
