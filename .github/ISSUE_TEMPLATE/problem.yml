name: First-use result, missing capability, or problem
description: Share a result from your own task, a missing capability, or the first error in a Gooo example or port.
body:
  - type: markdown
    attributes:
      value: |
        Tell us what you tried and what happened, whether it worked or stopped at the first error. For a completed run, describe the decision it helped with or what was still missing. Say whether you used your own public input or an unchanged example. A working demo, shared input link, inspection report, or build metadata is not required.
        English and Korean reports are welcome. Inspection JSON contains the exact original text. The source editor's Raw compiler response includes generated Go and selected Gooo code; it is not a receipt of executing the generated program. Share only public data: review source code, paths, text, files, and logs before submitting this public issue. Opening this form uploads, attaches, and submits nothing automatically.
  - type: dropdown
    id: entry-point
    attributes:
      label: Where did you try it?
      options:
        - Public browser demo
        - Gooo source editor
        - Unicode text inspector
        - Rectangle crop planner
        - Downloaded browser demo
        - Coding-agent first-program skill
        - Native setup, verification, or replay
        - Another path
    validations:
      required: true
  - type: dropdown
    id: agent-stage
    attributes:
      label: For a coding-agent trial, where did you get to? (optional)
      options:
        - Skill installation or tool setup
        - Skill discovery or activation
        - Editing Gooo source
        - Native execution of the changed source
        - Saved-receipt replay
        - Completed the edit, execution, and replay
  - type: textarea
    id: steps
    attributes:
      label: Page URL or command and steps
      description: Include the command or page and minimal public input if available; say whether the input is your own or an unchanged example. For source editing, include the activity name. For a function result, include its name and exact input. A visible error is enough if you cannot share input or source; for a loading failure, the page address is enough.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What happened, and what did you expect?
      description: Copy the visible error or actual result. Say what you expected if you know; a screenshot is also useful.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Agent or browser, version, and operating system, if known
      description: For a coding agent, name the client and version. For a native run, include your Go version if available. Missing tool versions do not prevent a report.
  - type: input
    id: version
    attributes:
      label: Release version or port revision, if known
      description: The archive name or the demo's Port revision can help. Leave this blank if loading failed.
  - type: textarea
    id: intended-use
    attributes:
      label: What would you use Gooo for? (optional)
      description: Describe one real task and the decision this result helped you make, or the input, output, or automation you still need. If this example does not help, explain what is missing.
  - type: textarea
    id: supporting-details
    attributes:
      label: Shared input link, compiler response, inspection report, or additional details (optional)
      description: For an agent trial, include the first failed command and diagnostic, or the changed result and execution/replay paths if available. A first setup error is enough; a completed run is not required. The function demo offers Copy link to this input. Inspection JSON contains the exact original text. Raw compiler response contains generated Go, selected Gooo code, and diagnostics; it does not prove generated program execution. Review any code, paths, or files before sharing them publicly. Logs and build metadata are optional.
